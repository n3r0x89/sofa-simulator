<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assi Simulator</title>
<meta http-equiv="refresh" content="2;url=./v2/">
<style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#241a14;color:#f2c14e;font:700 18px system-ui,sans-serif;text-align:center}</style>
</head><body><div>Assi Simulator wird geladen …<br><small style="color:#bba">Alte Offline-Kopien werden aufgeräumt.</small></div>
<script>
(async()=>{try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs){if(!r.scope.includes('/v2/'))await r.unregister()}}
if(window.caches){const ks=await caches.keys();await Promise.all(ks.filter(k=>!k.startsWith('sofa-v2-')).map(k=>caches.delete(k)))}}catch(e){}
location.replace('./v2/')})();
</script></body></html>
