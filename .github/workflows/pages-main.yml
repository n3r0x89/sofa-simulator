name: Seite veröffentlichen (main + v2)
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-main
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenbauen
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          touch _site/.nojekyll
          # Testversion: fehlende Bilder, Töne und Schriften aus dem Live-Spiel übernehmen
          if [ -d _site/test ]; then
            cp -rn _site/v2/sprites _site/v2/sounds _site/v2/fonts _site/test/
            cp -n _site/v2/icon-192.png _site/v2/icon-512.png _site/v2/apple-touch-icon.png _site/test/
          fi
          ls _site _site/v2 | head -40
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Kurz warten und nochmal versuchen
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
