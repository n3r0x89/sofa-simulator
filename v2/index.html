<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Assi Sim">
<meta name="theme-color" content="#1c1410">
<title>Assi Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
.btn.upd{background:#d33!important;color:#fff!important;font-weight:900;animation:updPulse 1s ease-in-out infinite}
@keyframes updPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(221,51,51,.7)}50%{transform:scale(1.03);box-shadow:0 0 0 8px rgba(221,51,51,0)}}
#bMenu.updDot{position:relative}#bMenu.updDot::after{content:'';position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:#e33;box-shadow:0 0 0 2px #2a1d16;animation:updPulse 1s infinite}
.sugg textarea{width:100%;min-height:140px;border-radius:12px;border:1px solid #6a5546;background:#1d1510;color:#f4e9dc;padding:10px;font:15px Nunito,sans-serif;box-sizing:border-box}

/*
VOICE: frech, verraucht, Vorabendfernsehen
IDEA: ein vergilbtes Wohnzimmer aus Sofasicht, HUD wie ein billiger Videotext
PICTURE: der Raum selbst, mit Glotze als Lichtquelle
COLOUR and TYPE: Nikotinbraun, Bier-Bernstein, Warnrot; Lilita One + Nunito
LAYOUT: zwei Leisten oben, darunter der Raum randlos, Dialoge als Karten
*/
:root{color-scheme:dark;--bg:#1c1410;--pan:#2a1f18;--pan2:#3a2b20;--ink:#f6e8cf;--dim:#bfa98a;--amb:#f2a93b;--red:#e2492f;--grn:#7fbf4d;--blu:#58a6d6}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 14px/1.35 Nunito,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.hud{background:var(--pan);padding:4px 8px;display:flex;gap:6px;align-items:center;border-bottom:1px solid #00000066}
.lvl{font:19px/1 'Lilita One',sans-serif;cursor:pointer;color:var(--amb);white-space:nowrap}
.bar{position:relative;height:7px;background:#0006;border-radius:6px;overflow:hidden;flex:1}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--amb);border-radius:6px;transition:width .3s}
.bar.chaos i{background:linear-gradient(90deg,#c9a24a,#8a5a2b,#5b3a1a)}
.lab{font-size:10.5px;line-height:1.2;color:var(--dim);white-space:nowrap}
.btn.sm{min-height:36px;min-width:36px;padding:0 6px;font-size:17px;border-radius:9px}
.btn{appearance:none;border:0;background:var(--pan2);color:var(--ink);font:800 15px Nunito,sans-serif;border-radius:10px;min-height:40px;min-width:44px;padding:6px 10px;cursor:pointer}
.btn:active{transform:translateY(1px);filter:brightness(1.2)}
.btn:focus-visible{outline:2px solid var(--amb)}
.btn.pri{background:var(--amb);color:#2a1a08}
.btn.red{background:var(--red)}
.btn[disabled]{opacity:.4}
#hud2{flex-direction:column;align-items:stretch;gap:3px;padding-top:2px;padding-bottom:5px}
.needs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.need .lab{display:flex;justify-content:space-between}
.need.hot i{background:var(--red)}
.need.beer i{background:linear-gradient(0deg,#d98a1d,#ffd36b)}
.info{display:flex;flex-wrap:wrap;gap:1px 9px;font-size:11.5px;line-height:1.3;color:var(--dim)}
.info b{color:var(--ink)}
#stage{position:relative;flex:1;overflow:hidden;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:50%;top:19%;transform:translate(-50%,-50%) scale(.9);max-width:86%;background:#120c09e8;border:2px solid var(--amb);border-radius:14px;padding:10px 14px;text-align:center;font:800 17px/1.25 Nunito,sans-serif;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:5}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast small{display:block;margin-top:4px;font-size:13px;color:var(--amb)}
#hint{position:absolute;left:8px;right:8px;top:8px;text-align:center;font-size:13px;color:#fff;background:#0009;border-radius:10px;padding:6px 8px;pointer-events:none;z-index:4}
#hint:empty{display:none}
#bubble{position:absolute;z-index:6;max-width:62%;background:#fff8ea;color:#2a1a08;border-radius:16px;padding:10px 12px;box-shadow:0 6px 20px #0008;display:none}
#bubble:after{content:"";position:absolute;left:-10px;top:24px;border:10px solid transparent;border-right-color:#fff8ea;border-left:0}
#bubble .who{font:16px 'Lilita One',sans-serif;color:#8a4b12}
#bubble p{margin:4px 0 8px;font-weight:800}
#bubble .opts{display:flex;flex-direction:column;gap:6px}
#bubble .btn{background:#2a1f18;color:#fff;font-size:14px;min-height:40px;text-align:left}
#bubble small{display:block;color:#a0521a;font-weight:800;margin-top:4px}
#card{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(88%,420px);z-index:7;background:var(--pan);border:2px solid var(--amb);border-radius:16px;padding:14px;display:none;box-shadow:0 10px 30px #000a}
#card h3{margin:0 0 6px;font:22px/1.1 'Lilita One',sans-serif;color:var(--amb)}
#card p{margin:0 0 10px;font-size:15px}
#card .opts{display:flex;flex-direction:column;gap:6px}
#card small{display:block;color:var(--amb);margin-top:6px;font-weight:800}
#modal{position:absolute;inset:0;z-index:20;background:#0d0907f2;display:none;flex-direction:column;padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom));overflow:auto;touch-action:pan-y}
#modal h2{margin:4px 0 10px;font:30px/1.05 'Lilita One',sans-serif;color:var(--amb)}
#modal h4{margin:12px 0 6px;font:18px 'Lilita One',sans-serif;color:var(--amb)}
#modal .list{display:flex;flex-direction:column;gap:8px}
#modal .row{display:flex;gap:10px;align-items:center;background:var(--pan);border-radius:12px;padding:8px 10px}
#modal .row .t{flex:1}
#modal .row .t b{display:block;font-size:15px}
#modal .row .t span{font-size:12.5px;color:var(--dim)}
#modal .row.off{opacity:.5}
#modal .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#modal p{font-size:15px;margin:6px 0}
#modal .close{margin-top:14px}
.menuT{font:52px/0.95 'Lilita One',sans-serif;color:var(--amb);text-shadow:0 4px 0 #6b3c0c;margin:24px 0 4px;text-align:center}
.menuS{text-align:center;color:var(--dim);margin-bottom:18px}
#mini{position:absolute;inset:0;z-index:15;display:none;background:#000c}
#minicv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#miniui{position:absolute;left:0;right:0;top:8px;text-align:center;font:20px 'Lilita One',sans-serif;color:#fff;pointer-events:none;text-shadow:0 2px 0 #000}
#minibtns{position:absolute;left:10px;right:10px;bottom:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ach{display:flex;gap:10px;align-items:center;background:var(--pan);border-radius:12px;padding:8px}
.ach .ic{width:34px;height:34px;border-radius:50%;background:#0005;display:grid;place-items:center;font:18px 'Lilita One';color:var(--dim)}
.ach.got .ic{background:var(--amb);color:#2a1a08}
.ach.got b{color:var(--amb)}
input[type=number]{font:16px Nunito;width:90px;border-radius:8px;border:0;padding:8px;background:#0006;color:var(--ink)}
.sheet{display:flex;gap:8px;align-items:center;background:var(--pan);border-radius:12px;padding:8px 10px}
.sheet .t{flex:1}
.sheet .t span{font-size:12px;color:var(--dim)}
.ok{color:var(--grn)}
#self{position:absolute;left:10px;right:10px;bottom:10px;z-index:6;background:#fff8eaee;color:#2a1a08;border-radius:14px;padding:8px 12px;font:800 15px/1.3 Nunito,sans-serif;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none}
#self.on{opacity:1;transform:none}
#self b{color:#a0521a}
.fade{position:absolute;inset:0;z-index:18;background:#000;opacity:0;transition:opacity .5s;display:grid;place-items:center;color:#f6e8cf;font:28px 'Lilita One',sans-serif;pointer-events:all}
.fade.on{opacity:1}
#cv.jig2{animation:jig .06s infinite alternate}.flash{position:absolute;inset:0;z-index:17;background:#fff3b0;pointer-events:none;animation:fl .7s forwards}@keyframes fl{from{opacity:.85}to{opacity:0}}
#cv.jig{animation:jig .12s infinite alternate}@keyframes jig{from{transform:translateY(0)}to{transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div class="hud" id="hud1">
    <div class="lvl" id="lvl">Lv 1</div>
    <div style="flex:1;display:flex;flex-direction:column;gap:2px">
      <div class="bar"><i id="xpbar" style="width:0"></i></div>
      <div class="lab" id="xplab">0 / 40 XP</div>
    </div>
    <button class="btn sm" id="bSnack" aria-label="Snack essen">🥨</button>
    <button class="btn sm" id="bShop" aria-label="Shop">🛒</button>
    <button class="btn sm" id="bDiary" aria-label="Tagebuch">📖</button>
    <button class="btn sm" id="bWash" aria-label="Körperpflege">🚿</button>
    <button class="btn sm" id="bSleep" aria-label="Schlafen">🛏</button>
    <button class="btn sm" id="bMenu" aria-label="Pause">☰</button>
  </div>
  <div class="hud" id="hud2">
    <div class="needs">
      <div class="need" id="nTh"><div class="lab"><span>Durst</span><span></span></div><div class="bar"><i></i></div></div>
      <div class="need" id="nHu"><div class="lab"><span>Hunger</span><span></span></div><div class="bar"><i></i></div></div>
      <div class="need" id="nBo"><div class="lab"><span>Langeweile</span><span></span></div><div class="bar"><i></i></div></div>
      <div class="need beer" id="nBe"><div class="lab"><span>Flasche</span><span></span></div><div class="bar"><i></i></div></div>
    </div>
    <div class="info" id="info"></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="toast"></div>
    <div id="hint"></div>
    <div id="bubble"></div>
    <div id="card"></div>
    <div id="mini"><canvas id="minicv"></canvas><div id="miniui"></div><div id="minibtns"></div></div>
    <div id="modal"></div>
  </div>
</div>
<script>
{
const APPVER=64;
// ================= CORE =================
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eur=v=>(Math.round(v*100)/100).toFixed(2).replace('.',',')+' €';
const SAVE='sofasim_v2';

function fresh(){return{
  day:1,hour:8,tot:0,lvl:1,xp:0,money:5,beer:6,snacks:2,cigs:10,
  th:20,hu:20,bo:20,chaos:0,prom:0,hang:0,mold:0,
  empties:0,basket:0,pfandStock:0,bottle:null,right:'empty',cigPuffs:0,butts:0,ash:0,stash:0,stashIn:0,stashDay:0,dirt:25,lastBeer:0,lastCig:0,mag:false,magCd:0,tissues:0,punches:0,stereo:0,loud:0,packClosed:false,smolderUntil:0,
  ch:0,tvOn:true,powerOutUntil:0,remoteGone:0,
  furn:{},lampOn:false,fridge:0,fridgeColdAt:0,massageAt:0,
  puddles:[],stains:[],splats:[],
  h:{neighbor:0,nice:0,niceDeeds:0,jc:0,inkasso:0,cutDays:0,police:0,lf:0,kowNo:0,kowYes:0,crimes:0,crimesOk:0,legal:0,caught:0,ignored:0,insults:0,calls:0,pizza:0,kowLast:-9,cake:false,banUntil:0,giftDone:false,uweTrades:0,lfVisit:0,jessLast:-9,jessTv:false},
  pukeAt:R(2.1,2.5),lastPuke:-999,sickSaid:false,taskDone:false,taskIdx:0,
  diary:0,diaryNew:false,
  jobCd:{},plasmaUntil:0,
  vhs:[],vhsV2:1,
  ach:{},st:{beers:0,throws:0,puke:0,filmriss:0,clean:0,pfandBottles:0,pfandMoney:0,tvH:0,films:0,tasks:0,games:0,zaps:[],schnitzel:0},
  best:{flight:0,pong:0,catch:0},
  sound:true,hintsDone:{},started:false
}}
let S=null;
function load(){try{const t=localStorage.getItem(SAVE);if(t){const o=JSON.parse(t);if(!o.vhsV2){o.vhs=[];o.vhsV2=1}const f=fresh();for(const k in f)if(o[k]===undefined)o[k]=f[k];for(const k in f.h)if(o.h[k]===undefined)o.h[k]=f.h[k];for(const k in f.st)if(o.st[k]===undefined)o.st[k]=f.st[k];if(o.ash===undefined||o.ash===0&&o.butts)o.ash=Math.min(o.butts||0,20);return o}}catch(e){}return null}
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function hasSave(){try{return !!localStorage.getItem(SAVE)}catch(e){return false}}
S=load()||fresh();

// ---------- Audio (synth) ----------
let AC=null,soundOn=true;
try{soundOn=localStorage.getItem('sofasim_snd')!=='0'}catch(e){}
function initAudio(){if(AC)return;try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();const b=AC.createBuffer(1,1,22050);const s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0)}catch(e){AC=null}loadBanks();setTimeout(()=>{try{musicSet()}catch(e){}},0)}
function env(g,t,a,d,v){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function tone(f,d,type='sine',v=.2,f2){if(!AC||!soundOn)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);env(g,t,.01,d,v);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.2,fl=800,q=1,type='lowpass',sweep){if(!AC||!soundOn)return;const t=AC.currentTime,n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(fl,t);if(sweep)f.frequency.exponentialRampToValueAtTime(sweep,t+d);f.Q.value=q;const g=AC.createGain();env(g,t,.01,d,v);s.connect(f).connect(g).connect(AC.destination);s.start(t)}
function wob(f,d,v,rate){if(!AC||!soundOn)return;const t=AC.currentTime,o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;l.frequency.value=rate;lg.gain.value=f*.35;l.connect(lg).connect(o.frequency);fl.type='lowpass';fl.frequency.value=400;env(g,t,.03,d,v);o.connect(fl).connect(g).connect(AC.destination);o.start(t);l.start(t);o.stop(t+d+.1);l.stop(t+d+.1)}
const SND={
  plop:()=>{tone(500,.08,'sine',.3,180);noise(.05,.1,3000)},
  gulp:()=>{tone(220,.12,'sine',.25,90);setTimeout(()=>tone(200,.1,'sine',.2,80),160)},
  burp:()=>wob(85,.55,.35,22),
  fart:()=>{wob(60,.8,.4,30);noise(.6,.15,300)},
  cough:()=>{noise(.18,.35,900,2,'bandpass');setTimeout(()=>noise(.2,.3,800,2,'bandpass'),260)},
  lighter:()=>{noise(.05,.3,4000,1,'highpass');setTimeout(()=>noise(.4,.08,2500,1,'bandpass'),80)},
  puff:()=>noise(.5,.12,1200,1,'bandpass',500),
  retch:()=>{wob(110,.5,.35,12);setTimeout(()=>noise(.7,.35,600,1,'lowpass',200),400)},
  whoosh:()=>noise(.3,.25,400,1,'bandpass',3000),
  smash:()=>{tone(2400,.25,'triangle',.2);tone(3100,.3,'triangle',.15);noise(.2,.2,5000,1,'highpass')},
  clink:()=>{tone(2400,.25,'triangle',.2);tone(3100,.3,'triangle',.15);noise(.2,.2,5000,1,'highpass')},
  slap:()=>noise(.08,.5,2000,1,'lowpass'),
  buzz:()=>tone(220,.4,'sawtooth',.05,240),
  knock:()=>{for(let i=0;i<3;i++)setTimeout(()=>noise(.06,.5,300),i*180)},
  bell:()=>{tone(880,.4,'triangle',.2);setTimeout(()=>tone(660,.6,'triangle',.2),350)},
  ring:()=>{for(let i=0;i<4;i++)setTimeout(()=>tone(1320,.08,'square',.08),i*110)},
  cash:()=>{tone(1800,.08,'square',.1);setTimeout(()=>tone(2400,.25,'triangle',.15),90)},
  stat:()=>noise(.25,.15,3000,.5,'highpass'),
  lvl:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.18,'triangle',.18),i*110)),
  bad:()=>{noise(.03,.22,2400,2,'bandpass');tone(140,.04,'square',.08)},
  pop:()=>tone(700,.06,'square',.08)
};
const BANKS={fart:['sounds/fart1.mp3','sounds/fart2.mp3','sounds/fart3.mp3','sounds/fart4.mp3','sounds/fart5.mp3','sounds/fart6.mp3','sounds/fart7.mp3'],burp:['sounds/burp1.mp3','sounds/burp2.mp3','sounds/burp3.mp3','sounds/burp4.mp3'],cough:['sounds/cough1.mp3','sounds/cough2.mp3'],retch:['sounds/retch1.mp3','sounds/retch2.mp3','sounds/retch3.mp3'],puff:['sounds/puff1.mp3','sounds/puff2.mp3'],plop:['sounds/plop1.mp3','sounds/plop2.mp3'],gulp:['sounds/gulp1.mp3','sounds/gulp2.mp3','sounds/gulp3.mp3','sounds/gulp4.mp3','sounds/gulp5.mp3'],bell:['sounds/bell1.mp3'],knock:['sounds/knock1.mp3'],clink:['sounds/clink1.mp3','sounds/clink2.mp3','sounds/clink3.mp3'],smash:['sounds/smash1.mp3','sounds/smash2.mp3','sounds/smash3.mp3','sounds/smash4.mp3'],lighter:['sounds/lighter1.mp3'],buzz:['sounds/buzz1.mp3','sounds/buzz2.mp3'],wake:['sounds/wake1.mp3'],fail:['sounds/fail1.mp3'],slap:['sounds/slap1.mp3'],cash:['sounds/cash1.mp3','sounds/cash2.mp3'],ring:['sounds/ring1.mp3'],lvl:['sounds/lvl1.mp3'],coo:['sounds/coo1.mp3'],groan:['sounds/groan1.mp3']};
const NOOVER={puff:1};const BUSY={};
const BUF={},ORD={},LAST={};let bankLoading=false;
function loadBanks(){if(!AC||bankLoading)return;bankLoading=true;for(const k in BANKS){BUF[k]=[];ORD[k]=[];BANKS[k].forEach((u,i)=>{fetch(u).then(r=>r.arrayBuffer()).then(b=>new Promise((res,rej)=>{const pr=AC.decodeAudioData(b,res,rej);if(pr&&pr.catch)pr.catch(rej)})).then(buf=>{BUF[k][i]=buf}).catch(()=>{})})}}
function playBank(k){if(!AC||!soundOn||!BUF[k])return false;const ok=BUF[k].map((b,i)=>b?i:-1).filter(i=>i>=0);if(!ok.length)return false;
  if(!ORD[k].length){ORD[k]=ok.slice().sort(()=>Math.random()-.5);if(ORD[k][0]===LAST[k]&&ORD[k].length>1)ORD[k].push(ORD[k].shift())}
  if(NOOVER[k]&&AC.currentTime<(BUSY[k]||0))return true;const i=ORD[k].shift();LAST[k]=i;try{const s=AC.createBufferSource();s.buffer=BUF[k][i];if(NOOVER[k])BUSY[k]=AC.currentTime+BUF[k][i].duration-.15;const g=AC.createGain();g.gain.value=.9;s.connect(g).connect(AC.destination);s.start();return true}catch(e){return false}}
let lastBad=0;function snd(n){try{if(n==='fail'){const nw=performance.now();if(nw-lastBad<3500)return;lastBad=nw}if(BANKS[n]&&playBank(n))return;SND[n]&&SND[n]()}catch(e){}}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

// ---------- Texte ----------
function slur(t){if(S.prom<1.1)return t;const k=clamp((S.prom-1.1)/1.2,0,1);
  return t.split(' ').map(w=>{if(Math.random()<.35*k)w=w.replace(/s(?!ch)/g,'sch');if(Math.random()<.3*k)w=w.replace(/([aeiou])/i,'$1$1');if(Math.random()<.12*k)w+='… hicks';return w}).join(' ')}

let toastT=0,toastQ=[],toastBusy=false,toastPrio=false;
function toast(msg,sub,long){const item={msg:slur(msg),sub,dur:long||(msg.length>70?4200:2200),prio:!!long||msg.length>70};
  if(toastBusy&&toastPrio){toastQ.push(item);if(toastQ.length>3)toastQ.shift();return}
  if(toastBusy&&item.prio){toastQ.unshift(item);showToast(toastQ.shift());return}
  showToast(item)}
function showToast(it){const el=$('toast');el.innerHTML=it.msg+(it.sub?'<small>'+it.sub+'</small>':'');el.classList.add('on');toastBusy=true;toastPrio=it.prio;clearTimeout(toastT);
  toastT=setTimeout(()=>{if(toastQ.length){showToast(toastQ.shift())}else{el.classList.remove('on');toastBusy=false;toastPrio=false}},toastQ.length?Math.min(it.dur,1800):it.dur)}
function fxStr(o){const N={money:['Geld',v=>(v>0?'+':'−')+eur(Math.abs(v))],beer:['Bier'],snacks:['Snacks'],cigs:['Kippen'],th:['Durst'],hu:['Hunger'],bo:['Langeweile'],chaos:['Chaos'],prom:['Promille',v=>(v>0?'+':'−')+Math.abs(v).toFixed(2)+'‰'],xp:['XP'],nice:['Ruf'],neighbor:['Nachbar'],police:['Polizei'],jc:['Jobcenter'],inkasso:['Inkasso'],lf:['Vermieter'],empties:['Leergut']};
  return Object.entries(o).filter(([k,v])=>v&&N[k]).map(([k,v])=>N[k][0]+' '+(N[k][1]?N[k][1](v):(v>0?'+':'−')+Math.abs(Math.round(v*10)/10))).join(' · ')}
function fx(o){for(const[k,v]of Object.entries(o)){if(!v)continue;
  if(k==='xp')addXP(v);
  else if(['money','beer','snacks','cigs','th','hu','bo','chaos','prom','empties'].includes(k)){S[k]+=v;if(k==='money'&&v)snd('cash')}
  else if(k in S.h){S.h[k]+=v;if(k==='nice'&&v>0)S.h.niceDeeds+=v;if(k==='police')S.h.police=Math.max(0,S.h.police)}}
  clampAll();return fxStr(o)}
function clampAll(){S.th=clamp(S.th,0,100);S.hu=clamp(S.hu,0,100);S.bo=clamp(S.bo,0,100);S.chaos=clamp(S.chaos,0,100);S.prom=Math.max(0,S.prom);S.beer=Math.max(0,S.beer);S.snacks=Math.max(0,S.snacks);S.cigs=Math.max(0,S.cigs);S.empties=Math.max(0,S.empties);S.money=Math.round(S.money*100)/100}

// ---------- XP ----------
function xpFactor(){let f=1;for(const n of[S.th,S.hu,S.bo])if(n>80)f-=.25;if(S.hang>0)f-=.25;f-=.1*S.mold;if(S.dirt>70)f-=.1;try{f-=.15*withdrawal().v}catch(e){}f=Math.max(.25,f);if(S.furn.neon)f+=.1;return f}
function addXP(n){S.xp+=n*xpFactor();while(S.xp>=S.lvl*40){S.xp-=S.lvl*40;S.lvl++;levelUp()}}
function levelUp(){snd('lvl');vib([60,40,60]);let extra='';
  if(S.lvl===8)extra='Videorekorder jetzt im Katalog.';
  if(S.lvl===15)extra='Größerer Fernseher im Katalog freigeschaltet.';
  if(S.lvl===20){S.furn.lava=true;extra='Geschenk: Lavalampe steht auf dem Schrank.'}
  if(S.lvl===50){S.furn.gold=true;S.furn.massage=true;extra='Der goldene Fernsehsessel ersetzt den schwarzen Sessel – mit Massage.'}
  if(S.lvl===2)extra='Frau Kowalski hat dich jetzt auf dem Schirm…';
  toast(T('lvl').replace('{l}',S.lvl),extra,3200);checkAch()}

function hourStr(){const h=Math.floor(S.hour),m=Math.floor((S.hour-h)*60);return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function isNight(){return S.hour>=23||S.hour<5}
function canSleep(){return S.hour>=19||S.hour<6}
function advance(dt,mult=1){ // dt real seconds of game time passing
  const prev=S.hour;S.hour+=dt/10;S.tot+=dt;
  if(prev<6&&S.hour>=6)newDay();
  if(S.hour>=24){S.hour-=24;if(S.hour>=6)newDay()}
  const hk=S.hang>0?1.4:1;
  S.th+=.2*dt*(S.furn.fridge?.8:1)*hk*mult;S.hu+=.14*dt*hk*mult;S.bo+=.4*dt*(S.furn.massage?.6:1)*mult;
  S.chaos+=(S.furn.plant?-.06:-.03)*dt+.05*S.puddles.length*dt;
  S.prom=Math.max(0,S.prom-.006*dt);S.dirt=Math.min(100,(S.dirt||0)+dt*.11);
  if(S.tvOn&&!powerOut())S.st.tvH+=dt/10;
  clampAll()}
function powerOut(){return S.tot<S.powerOutUntil}
function newDay(){S.day++;let lines=[];
  const st=S.h.cutDays>0?3:6;S.money+=st;lines.push('Stütze +'+eur(st)+(S.h.cutDays>0?' (gekürzt)':''));if(S.h.cutDays>0)S.h.cutDays--;
  if(S.h.police>0)S.h.police--;
  if(S.h.cake){S.snacks+=2;S.h.cake=false;lines.push('Kuchen von Frau Kowalski: +2 Snacks')}
  if(S.diary<DIARY.length){S.diary++;S.diaryNew=true;lines.push('Neuer Tagebucheintrag')}
  if(S.prom>1.6){S.hang=4;lines.push('Schwerer Kater')}else if(S.prom>0.8){S.hang=Math.max(S.hang,2);lines.push('Kater')}
  if(S.chaos>=65||S.empties>=10){if(S.mold<3){S.mold++;lines.push('Schimmel wächst (Stufe '+S.mold+')')}}else if(S.mold>0&&Math.random()<.5){S.mold--;lines.push('Schimmel geht zurück')}
  if(S.mold>=2){S.h.neighbor++;lines.push('Die Nachbarn meckern über den Gestank')}
  for(const v of S.vhs){const late=S.day-v.due;if(late>0){if(late>3){v.lost=true;lines.push('Videothek behält die Kaution für „'+FILMS[v.id].t+'“')}else{S.money-=1.5;lines.push('Mahngebühr Videothek −1,50 €')}}}
  S.vhs=S.vhs.filter(v=>!v.lost);
  S.pendingDay=lines;checkAch()}

function keyFlood(g,w,h,grey){const d=g.getImageData(0,0,w,h),a=d.data,bg=new Uint8Array(w*h),st=[];
  const isBg=p=>{const r=a[p*4],gg=a[p*4+1],b=a[p*4+2];if(grey)return Math.abs(r-128)+Math.abs(gg-128)+Math.abs(b-128)<30;const mn=Math.min(r,gg,b),mx=Math.max(r,gg,b);return mn>226&&mx-mn<25};
  for(let x=0;x<w;x++){st.push(x,(h-1)*w+x)}for(let y=0;y<h;y++){st.push(y*w,y*w+w-1)}
  while(st.length){const p=st.pop();if(bg[p]||!isBg(p))continue;bg[p]=1;const x=p%w;if(x>0)st.push(p-1);if(x<w-1)st.push(p+1);if(p>=w)st.push(p-w);if(p<w*(h-1))st.push(p+w)}
  let x0=w,y0=h,x1=0,y1=0;for(let p=0;p<w*h;p++){if(bg[p]){a[p*4+3]=0;continue}const x=p%w,y=(p-x)/w;
    if((x>0&&bg[p-1])||(x<w-1&&bg[p+1])||(p>=w&&bg[p-w])||(p<w*(h-1)&&bg[p+w])){const mn=Math.min(a[p*4],a[p*4+1],a[p*4+2]);if(!grey&&mn>200)a[p*4+3]=Math.round((255-mn)/55*255)}
    if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  g.putImageData(d,0,0);return[x0,y0,x1,y1]}

    const cx0=(i%sh.c)*cw+ins,cy0=Math.floor(i/sh.c)*chh+ins,w=Math.round(cw-2*ins),h=Math.round(chh-2*ins);
    const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.drawImage(img,cx0,cy0,w,h,0,0,w,h);let out=c;
    if(keyMode){const[x0,y0,x1,y1]=keyFlood(g,w,h,keyMode==='grey');if(x1>x0&&y1>y0){out=document.createElement('canvas');out.width=x1-x0+1;out.height=y1-y0+1;out.getContext('2d').drawImage(c,x0,y0,out.width,out.height,0,0,out.width,out.height)}}

  return n}

  if(mode==='cover'){const s=Math.max(b.w/i.naturalWidth,b.h/i.naturalHeight);const w=i.naturalWidth*s,h=i.naturalHeight*s;cx.drawImage(i,b.x+(b.w-w)/2,b.y+(b.h-h)/2,w,h);return true}

const HINTS=[['remote','Fernbedienung antippen, dann links/rechts wischen zum Zappen.'],['zap','Wischen links/rechts wechselt den Sender.'],['beer','Sixpack antippen für eine Flasche.'],['open','Flasche antippen: Kronkorken öffnen.'],['drink','Flasche gedrückt halten zum Trinken.'],['cig','Zigarettenschachtel antippen, dann Kippe gedrückt halten.'],['put','Auf den Tisch tippen legt ab, was du in der Hand hast.']];
function doneHint(k){S.hintsDone[k]=1;if(k==='zap')S.hintsDone.remote=1}
function hintText(){if(S.lvl>4)return'';for(const[k,t]of HINTS)if(!S.hintsDone[k]){if(k==='zap'&&S.right!=='remote')continue;if(k==='drink'&&(!S.bottle||S.bottle.opened===false))continue;if(k==='open'&&!(S.bottle&&S.bottle.opened===false))continue;if(k==='put'&&S.right==='empty')continue;return t}return''}

let PUKE=null,PD=null,burpT=0,burpCnt=0,burpNext=RI(1,5),coughCnt=0,coughNext=RI(1,7);
function lp(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function hitAt(p){const kb=HITS.find(h=>h.id==='basket');if(kb&&p.x>=kb.x&&p.x<=kb.x+kb.w&&p.y>=kb.y&&p.y<=kb.y+kb.h)return 'basket';for(let i=HITS.length-1;i>=0;i--){const h=HITS[i];if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h)return h.id}return null}
cv.addEventListener('pointerdown',e=>{initAudio();if(busyUI||PUKE)return;const p=lp(e);PD={p,t:performance.now(),id:hitAt(p),last:performance.now(),acted:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!PD)return;PD.cur=lp(e)});
cv.addEventListener('pointerup',e=>{if(!PD)return;const p=lp(e),dt=performance.now()-PD.t,dx=p.x-PD.p.x,dy=p.y-PD.p.y;const id=PD.id;const acted=PD.acted;PD=null;if(busyUI)return;
  if(acted&&id==='bottle'){burpCnt++;if(burpCnt>=burpNext){burpCnt=0;burpNext=RI(1,5);clearTimeout(burpT);burpT=setTimeout(()=>{snd('burp');vib(60);if(Math.random()<.5)toast(T('burp'))},600)}}
  if(id==='bottle'&&dy<-70&&dt<450&&Math.abs(dy)>Math.abs(dx)){throwBottle();return}
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)&&dt<700){if(S.right==='remote'){zap(dx<0?1:-1);return}}
  if(acted||dt>450&&(id==='bottle'||id==='right'))return;
  if(Math.hypot(dx,dy)>25)return;tap(id,p)});
cv.addEventListener('pointercancel',()=>PD=null);
function holdTick(){if(!PD||busyUI)return;const now=performance.now();if(now-PD.t<350)return;const cur=PD.cur||PD.p;if(Math.hypot(cur.x-PD.p.x,cur.y-PD.p.y)>30)return;
  if(now-PD.last<650&&PD.acted)return;
  if(PD.id==='bottle'&&S.bottle){PD.acted=true;PD.last=now;sip()}
  else if(PD.id==='right'&&S.right==='cig'){PD.acted=true;PD.last=now;puff()}}
function tap(id,p){
  // puddles
  for(const pd of S.puddles){if(Math.hypot(p.x-pd.x,(p.y-pd.y)*2)<46){cleanPuddle(pd);return}}
  // Taschentücher und Flecken an der Wand
  {const th=HITS.find(h=>h.id==='tissue'&&p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h);if(th&&S.tissues>0)return tissueTap()}
  if(!id||id==='wall'){for(const st of S.stains){if(Math.hypot(p.x-st.x,p.y-st.y)<34){return cleanStain(st,'stain')}}
    for(const sp of S.splats){if(Math.hypot(p.x-sp.x,p.y-sp.y)<24){return cleanStain(sp,'splat')}}}
  // furniture
  const inB=b=>b&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
  if(S.mag&&L.magR&&inB(L.magR)&&(id==='right'||id==='lefthand')&&S.right!=='cig'&&!S.bottle)return magTap();
  if(VISIT&&inB({x:L.visitor.x+VISIT.x,y:L.visitor.y,w:L.visitor.w,h:L.visitor.h})&&!id)return;
  switch(id){
   case'crate':return takeBeer(false);
   case'cigpack':return takeCig();
   case'remote':if(!needRightFree('remote'))return;S.right='remote';snd('pop');doneHint('remote');return;
   case'phone':if(!needRightFree('phone'))return;S.right='phone';snd('pop');return openPhone();
   case'catalog':return openCatalog();
   case'ctrl':if(!needRightFree('ctrl'))return;S.right='ctrl';snd('pop');return openGames();
   case'empty':return toBasket(false);
   case'basket':if(S.empties>0)return toBasket(true);return toast(S.basket?S.basket+' Flaschen im Korb. Im Shop gibt’s Pfand dafür.':'Der Korb ist leer. Wie dein Bett seit Jessica.');
   case'ash':return emptyAsh();
   case'stash':return stashMenu();
   case'stereo':return stereoTap();
   case'mag':return magTap();
   case'tissue':return tissueTap();
   case'table':return putDown();
   case'right':if(S.right==='phone')return openPhone();if(S.right==='ctrl')return openGames();return;
   case'bottle':if(S.bottle&&S.bottle.opened===false)return openBottle();if(S.bottle&&S.bottle.sips<=0)return putDown();return toast('Gedrückt halten zum Trinken, du Saufanfänger. Selbst Babys können nuckeln.');
  }
  if(S.furn.fridge&&inB(L.fridge))return fridgeTap();
  if(S.furn.massage&&inB(L.massage))return massage();
  if(S.furn.lamp&&inB(L.lamp)){S.lampOn=!S.lampOn;snd('pop');return toast(S.lampOn?'Licht an. Jetzt sieht man das ganze Elend, inklusive dir.':'Licht aus. Jetzt muss keiner mehr deine Fresse sehen.')}
  if(S.furn.vcr&&inB(L.vcr))return openVideo();
  if(S.furn.console&&inB(L.console)){if(!needRightFree('ctrl'))return;S.right='ctrl';return openGames()}
  if(inB(L.tv)){if(S.right==='remote')return toast('Wischen, nicht tippen, du Fingerakrobat. Links oder rechts. Selbst du kriegst das hin.');return toast('Nimm die Fernbedienung, du Neandertaler. Mit Draufglotzen allein schaltet nix um.')}
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function visit(who,text,opts,pose=0){if(GREET[CUR_EV]&&Math.random()<.8)text=pick(GREET[CUR_EV]);if(S.dirt>70&&Math.random()<.5&&who!=='kowalski')text=pick(STINK)+' '+text;VISIT={who,pose,x:-220,target:0};snd(Math.random()<.5?'knock':'bell');vib(60);setTimeout(()=>showBubble(who,text,opts),650)}
function placeBubble(){const r=cv.getBoundingClientRect(),sc=r.width/W;bub.style.left=((L.visitor.x+L.visitor.w*.9)*sc)+'px';bub.style.top=((L.visitor.y-10)*sc)+'px'}
function showBubble(who,text,opts){if(!VISIT)return;if(PUNCHABLE[who]&&!opts.some(o=>o.punch))opts=opts.concat([Object.assign(punchOpt(who),{punch:1})]);placeBubble();bub.innerHTML='<div class="who">'+esc(VIS[who].n)+'</div><p>'+esc(text)+'</p><div class="opts">'+opts.map((o,i)=>'<button class="btn" data-i="'+i+'">'+esc(o.t)+'</button>').join('')+'</div>';bub.style.display='block';
  bub.querySelectorAll('button').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];const r=o.f()||{};if(r.pose!==undefined)VISIT.pose=r.pose;
    bub.innerHTML='<div class="who">'+esc(VIS[who].n)+'</div><p>'+esc(r.say||'…')+'</p>'+(r.fx?'<small>'+esc(r.fx)+'</small>':'');snd('pop');
    if(r.after){setTimeout(()=>{if(VISIT)showBubble(who,r.after.text,r.after.opts)},2200);return}
    setTimeout(leave,2800);checkAch()})}
function leave(){bub.style.display='none';if(VISIT){VISIT.target=-260;setTimeout(()=>{VISIT=null},900)}evTimer=R(25,45)}
function showCard(title,text,opts){CARD=1;$('toast').classList.remove('on');card.innerHTML='<h3>'+esc(title)+'</h3><p>'+esc(text)+'</p><div class="opts">'+opts.map((o,i)=>'<button class="btn'+(i===0?' pri':'')+'" data-i="'+i+'">'+esc(o.t)+'</button>').join('')+'</div>';card.style.display='block';
  card.querySelectorAll('button').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];const r=(o.f&&o.f())||{};snd('pop');
    if(r.say){card.innerHTML='<h3>'+esc(title)+'</h3><p>'+esc(r.say)+'</p>'+(r.fx?'<small>'+esc(r.fx)+'</small>':'')+'<div class="opts" style="margin-top:10px"><button class="btn pri">Weiter</button></div>';card.querySelector('button').onclick=closeCard}
    else closeCard();checkAch()})}
function closeCard(){card.style.display='none';CARD=null;evTimer=R(25,45)}

let callTimer=0;
function ringPhone(){CALL={c:pick(CALLS),until:S.tot+12};snd('ring');vib([200,100,200]);toast('Das Handy klingelt! Antippen zum Rangehen.');callTimer=setInterval(()=>{if(!CALL){clearInterval(callTimer);return}snd('ring');vib(150);if(S.tot>CALL.until)missCall()},1500)}
function missCall(){if(!CALL)return;const c=CALL.c;CALL=null;clearInterval(callTimer);S.h.ignored++;const r=c.miss();toast('Verpasster Anruf: '+c.n,typeof r==='string'?r:'');evTimer=R(25,45);checkAch()}
function answerCall(){const c=CALL.c;CALL=null;clearInterval(callTimer);S.h.calls++;
  showCard(c.n,c.t,c.o.map(([t,f])=>({t,f})));checkAch()}
// ---------- Scheduler ----------
function eventTick(dt){if(VISIT||CARD||CALL||busyUI||PUKE)return;evTimer-=dt;if(evTimer>0)return;
  const ok=EVENTS.filter(e=>e.id!==lastEv&&e.c());const pr=ok.filter(e=>e.prio);const np=ok.filter(e=>!e.prio);const e=pr.length?pr[0]:(np.length?pickEvent(np):null);if(!e){evTimer=10;return}noteEvent(e);CUR_EV=e.id;
  lastEv=e.id;evTimer=R(25,45);e.run()}

function swat(kind,title){miniOpen();const Wm=mcv.width,Hm=mcv.height,dur=R(12,14);let t0=performance.now(),hits=0;const bugs=[];for(let i=0;i<6;i++)bugs.push(nb());

  mui.textContent=title;
  let tool={x:Wm*.5,y:Hm*.8,t:-9},buzzT=.3;
  MG={move:p=>{tool.x=p.x;tool.y=p.y},down:p=>{tool={x:p.x,y:p.y,t:performance.now()/1000};let hit=false;for(const b of bugs)if(!b.dead&&Math.hypot(p.x-b.x,p.y-b.y)<36){b.dead=1;hits++;hit=true;snd('slap');vib(30);{const z=L.stainZone||{x:0,y:0,w:W,h:L.wall-20};S.splats.push({x:z.x+p.x/Wm*z.w,y:z.y+p.y/Hm*z.h})};if(S.splats.length>40)S.splats.shift();setTimeout(()=>Object.assign(b,nb()),400)}if(!hit)snd('pop')},
   step:dt=>{const el=(performance.now()-t0)/1000;if(kind==='fly'||kind==='mosquito'){buzzT-=dt;if(buzzT<=0&&bugs.some(b=>!b.dead)){buzzT=R(.7,1.6);snd('buzz')}}const rm=SP.room;if(rm&&rm.naturalWidth){const sc=Math.max(Wm/rm.naturalWidth,Hm/(rm.naturalHeight*.55));mc.drawImage(rm,0,0,rm.naturalWidth,rm.naturalHeight*.55,(Wm-rm.naturalWidth*sc)/2,0,rm.naturalWidth*sc,rm.naturalHeight*.55*sc);mc.fillStyle='rgba(0,0,0,.25)';mc.fillRect(0,0,Wm,Hm)}else{mc.fillStyle='#d8c08a';mc.fillRect(0,0,Wm,Hm);mc.fillStyle='#0002';for(let x=0;x<Wm;x+=30)mc.fillRect(x,0,15,Hm)}
    for(const b of bugs){if(b.dead){mc.fillStyle='#3a1a0a';mc.beginPath();mc.ellipse(b.x,b.y,10,7,0,0,7);mc.fill();continue}b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.random()<.03){b.vx=R(-200,200);b.vy=R(-200,200)}if(b.x<20||b.x>Wm-20)b.vx*=-1;if(b.y<50||b.y>Hm-20)b.vy*=-1;
     if(!mspr(kind,b.x-20,b.y-20,40,40)){mc.fillStyle=kind==='dustbunny'?'#999':kind==='roach'?'#5a3010':'#222';mc.beginPath();mc.ellipse(b.x,b.y,kind==='roach'?14:9,kind==='roach'?8:6,0,0,7);mc.fill();if(kind!=='roach'&&kind!=='dustbunny'){mc.fillStyle='#cde8';mc.beginPath();mc.ellipse(b.x-6,b.y-7,7,4,-.5,0,7);mc.ellipse(b.x+6,b.y-7,7,4,.5,0,7);mc.fill()}}}
    drawSwatTool(kind==='roach'?'roach':'fly',tool.x,tool.y,performance.now()/1000-tool.t);
    mui.textContent=title+' · '+hits+' · '+Math.max(0,Math.ceil(dur-el))+' s';
    if(el>=dur){const b=Math.round(clamp(12+hits*.6,12,18));S.st.tasks++;miniClose();toast(hits+' erwischt. Mehr Tote als Frauen in deinem Leben.',fx({bo:-b,xp:3}));checkAch()}}};}
function countGame(kind,title){miniOpen();const Wm=mcv.width,Hm=mcv.height,n=RI(4,11);let shown=0,t0=performance.now(),items=[],next=0;mui.textContent=title+': gut aufpassen!';

function gPong(){miniOpen();const Wm=mcv.width,Hm=mcv.height;let px=Wm/2,cx2=Wm/2,bx=Wm/2,by=Hm/2,vx=R(-160,160),vy=260,me=0,cpu=0;mui.textContent='Assi-Pong · ziehen zum Steuern';mbtn('Aufhören',miniClose,'btn');

  ell(ux+uw*.5,b.y+b.h-uh*.25,uh*.13,uh*.13,'#888');cx.fillStyle=on?'#ff3030':'#400';cx.fillRect(ux+uw*.1,b.y+b.h-uh*.2,uw*.06,uh*.08);
  hit('stereo',b)}
// ================= HUD =================
function setNeed(id,v,label){const el=$(id);el.classList.toggle('hot',v>=80);el.querySelector('i').style.width=v+'%';el.querySelector('.lab span:last-child').textContent=label!==undefined?label:Math.round(v)}
var warnT={th:0,hu:0,bo:0};
function hud(){if(S.lvl>=20&&!S.furn.lava)S.furn.lava=true;if(S.lvl>=50&&!S.furn.gold)S.furn.gold=true;$('lvl').textContent='Lv '+S.lvl;$('xpbar').style.width=(S.xp/(S.lvl*40)*100)+'%';$('xplab').textContent=Math.floor(S.xp)+' / '+S.lvl*40+' XP · ×'+xpFactor().toFixed(2).replace('.',',');
  
  setNeed('nTh',S.th);setNeed('nHu',S.hu);setNeed('nBo',S.bo);const b=S.bottle;setNeed('nBe',b?b.sips/3*100:0,b?(b.sips?Math.round(b.sips/3*100)+'%':'leer'):'–');
  const bits=['<b>'+eur(S.money)+'</b>','Bier <b>'+S.beer+'</b>','Snacks <b>'+S.snacks+'</b>','Kippen <b>'+S.cigs+'</b>','Tag <b>'+S.day+'</b> <b>'+hourStr()+'</b>','<b>'+S.prom.toFixed(2).replace('.',',')+' ‰</b>','Leergut <b>'+S.empties+'</b>','Korb <b>'+S.basket+'</b>','Chaos <b>'+Math.round(S.chaos)+'</b>'];
  bits.push('Gestank <b>'+Math.round(S.dirt||0)+'</b>');if(S.furn.stash)bits.push('Versteck <b>'+eur(S.stash||0)+'</b>');if(withdrawal().v>.2)bits.push('<b style="color:var(--red)">Entzug</b>');if(S.hang>0)bits.push('Kater <b>'+'●'.repeat(S.hang)+'</b>');if(S.mold>0)bits.push('Schimmel <b>'+S.mold+'</b>');if(S.h.police>=3)bits.push('<b style="color:var(--red)">Polizei '+S.h.police+'</b>');if(S.h.cutDays>0)bits.push('Kürzung');
  $('info').innerHTML=bits.join(' · ');$('bSleep').disabled=!canSleep();$('bDiary').textContent=S.diaryNew?'📖•':'📖';
  $('hint').textContent=busyUI?'':hintText()}
// ================= LOOP =================
let lastT=performance.now(),acc=0,idleFart=R(50,150),saveT=0;
function frame(now){const dtr=Math.min(.1,(now-lastT)/1000);lastT=now;const t=now/1000;
  try{
  if(MG&&MG.step){mc.clearRect(0,0,mcv.width,mcv.height);MG.step(dtr)}
  if(!busyUI&&S.started){advance(dtr);
    holdTick();eventTick(dtr);moreTick(dtr);
    // TV ads / night / film
    if(tvState.film!==null){S.bo-=1.6*dtr;if(S.tot-tvState.filmStart>=56){S.st.films++;addXP(12);toast('Abspann. Großes Kino.','XP +12');tvState.film=null;checkAch()}
      if(!tvState.brandtDone&&S.tot-tvState.filmStart>20){tvState.brandtDone=true;if(Math.random()<.25){snd('knock');S.h.neighbor++;toast('Herr Brandt hämmert an die Wand: „DAS HÖRT MAN BIS HIER!“','Nachbar +1')}}}
    else{tvState.brandtDone=false;if(S.tot-tvState.lastAd>=60&&S.tvOn){tvState.lastAd=S.tot;tvState.adUntil=S.tot+8;tvState.flies=0}
      if(tvState.adUntil>S.tot&&Math.random()<dtr*1.5)tvState.flies++;
      if(!isNight())tvState.night=false;
      if(S.ch===3&&tvState.adUntil<S.tot){schnitzelT+=dtr;if(schnitzelT>40&&!S.st.schnitzel){S.st.schnitzel=1;checkAch()}}}
    if(S.tvOn&&!powerOut())addXP(.12*dtr);
    // idle body stuff
    idleFart-=dtr;if(idleFart<=0){idleFart=R(50,150);if(!VISIT&&!CARD){snd('fart');vib(80);toast(T('fart'))}}
    // need warnings
    for(const k of['th','hu','bo']){if(S[k]>=80&&S.tot-warnT[k]>30){warnT[k]=S.tot;toast(TX[k]);snd('bad')}}
    smokeLevel=Math.max(0,smokeLevel-dtr*.03);
    if(handAnim.drink>0)handAnim.drink-=dtr*1.5;if(handAnim.throwT>0)handAnim.throwT-=dtr*2.2;if(handAnim.puff>0)handAnim.puff-=dtr;if(handAnim.snack>0)handAnim.snack-=dtr;if(handAnim.capT>0)handAnim.capT-=dtr*1.6;if(handAnim.cigFly>0)handAnim.cigFly-=dtr*2.5;
    if(S.prom>=S.pukeAt)puke();if(S.prom<.5){S.taskDone=false}
    if(S.prom>=1.1&&!S.taskDone&&!VISIT&&!CARD&&!PUKE){S.taskDone=true;setTimeout(offerDrunkTask,1500)}
    if(S.prom>=1.9&&!S.sickSaid){S.sickSaid=true;toast(T('sick'))}
    if(S.pendingDay)showDay();
    saveT+=dtr;if(saveT>10){saveT=0;save()}}
  // draw
  HITS=[];cx.save();
  if(PUKE){const k=PUKE.t;const sh=k<.55?k*16:k<1.9?7:Math.max(0,7-(k-1.9)*10);cx.translate(R(-sh,sh),R(-sh,sh)+(k>.4&&k<1.9?6:0));const sq=k<.55?1-k*.04:1;cx.translate(W/2,H/2);cx.scale(1,sq);cx.translate(-W/2,-H/2)}
  if(S.prom>=1.1){const k=Math.min(1,(S.prom-1)/1.5);cx.translate(W/2,H/2);cx.rotate(Math.sin(t*.9)*.015*k);cx.translate(-W/2+Math.sin(t*.7)*6*k,-H/2)}
  pukeTick(Math.min(.05,dtr));drawRoom(t);drawVisitor(t);drawTable(t);drawHands(t);smokeTick(t);drawOverlay(t);drawPuke(t);drawFist();drawMagAnim(t);cx.restore();
  hud()}catch(err){console.error(err)}
  requestAnimationFrame(frame)}

// ================= BINDINGS =================
$('bMenu').onclick=()=>{initAudio();snd('pop');pauseMenu()};
$('bSnack').onclick=()=>{initAudio();if(!busyUI)eatSnack()};
$('bShop').onclick=()=>{initAudio();snd('pop');shopMenu()};
$('bDiary').onclick=()=>{initAudio();snd('pop');diaryMenu()};
$('bWash').onclick=()=>{initAudio();snd('pop');if(!busyUI)washMenu()};
$('bSleep').onclick=()=>{initAudio();if(!busyUI)sleep()};
$('lvl').onclick=()=>{const n=performance.now();if(n-adminT>1500)adminTaps=0;adminT=n;if(++adminTaps>=5){adminTaps=0;adminMenu()}};
window.addEventListener('resize',()=>{layout();if(VISIT)placeBubble()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(!busyUI&&S.started)pauseMenu()}});
window.addEventListener('pagehide',save);
layout();try{window.__dbg={L:()=>L,W:()=>W,H:()=>H,ev:id=>{CUR_EV=id;EVENTS.find(e=>e.id===id).run()},swat:(k,t)=>swat(k,t),S:()=>S,hits:()=>HITS,dist:n=>{const c={},w={};let last='';const nv=()=>{};for(let i=0;i<n;i++){const ok=EVENTS.filter(e=>e.id!==last&&!e.prio&&e.c());const e=pickEvent(ok);noteEvent(e);c[e.id]=(c[e.id]||0)+1;if(EV_WHO[e.id])w[EV_WHO[e.id]]=(w[EV_WHO[e.id]]||0)+1;last=e.id}return{c,w}},run:s=>eval(s),greet:()=>Object.fromEntries(Object.entries(GREET).map(([k,v])=>[k,v.length]))}}catch(e){}
loadSprites().then(()=>{});
mainMenu();
requestAnimationFrame(frame);
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
