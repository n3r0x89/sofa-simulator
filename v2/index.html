<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Sofa Sim">
<meta name="theme-color" content="#1c1410">
<title>Sofa Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: frech, verraucht, Vorabendfernsehen
IDEA: ein vergilbtes Wohnzimmer aus Sofasicht, HUD wie ein billiger Videotext
PICTURE: der Raum selbst, mit Glotze als Lichtquelle
COLOUR and TYPE: Nikotinbraun, Bier-Bernstein, Warnrot; Lilita One + Nunito
LAYOUT: zwei Leisten oben, darunter der Raum randlos, Dialoge als Karten
*/
:root{color-scheme:dark;--bg:#1c1410;--pan:#2a1f18;--pan2:#3a2b20;--ink:#f6e8cf;--dim:#bfa98a;--amb:#f2a93b;--red:#e2492f;--grn:#7fbf4d;--blu:#58a6d6}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 14px/1.35 Nunito,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.hud{background:var(--pan);padding:6px 8px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #00000066}
.lvl{font:22px/1 'Lilita One',sans-serif;color:var(--amb);white-space:nowrap}
.bar{position:relative;height:12px;background:#0006;border-radius:6px;overflow:hidden;flex:1}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--amb);border-radius:6px;transition:width .3s}
.bar.chaos i{background:linear-gradient(90deg,#c9a24a,#8a5a2b,#5b3a1a)}
.lab{font-size:11px;color:var(--dim);white-space:nowrap}
.btn{appearance:none;border:0;background:var(--pan2);color:var(--ink);font:800 15px Nunito,sans-serif;border-radius:10px;min-height:40px;min-width:44px;padding:6px 10px;cursor:pointer}
.btn:active{transform:translateY(1px);filter:brightness(1.2)}
.btn:focus-visible{outline:2px solid var(--amb)}
.btn.pri{background:var(--amb);color:#2a1a08}
.btn.red{background:var(--red)}
.btn[disabled]{opacity:.4}
#hud2{flex-direction:column;align-items:stretch;gap:5px;padding-top:4px}
.needs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.need .lab{display:flex;justify-content:space-between}
.need.hot i{background:var(--red)}
.need.beer i{background:linear-gradient(0deg,#d98a1d,#ffd36b)}
.info{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--dim)}
.info b{color:var(--ink)}
.acts{display:flex;gap:6px}
.acts .btn{flex:1;font-size:18px;min-height:38px}
#stage{position:relative;flex:1;overflow:hidden;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%) scale(.9);max-width:86%;background:#120c09e8;border:2px solid var(--amb);border-radius:14px;padding:10px 14px;text-align:center;font:800 17px/1.25 Nunito,sans-serif;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:5}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast small{display:block;margin-top:4px;font-size:13px;color:var(--amb)}
#hint{position:absolute;left:8px;right:8px;top:8px;text-align:center;font-size:13px;color:#fff;background:#0009;border-radius:10px;padding:6px 8px;pointer-events:none;z-index:4}
#hint:empty{display:none}
#bubble{position:absolute;z-index:6;max-width:62%;background:#fff8ea;color:#2a1a08;border-radius:16px;padding:10px 12px;box-shadow:0 6px 20px #0008;display:none}
#bubble:after{content:"";position:absolute;left:-10px;top:24px;border:10px solid transparent;border-right-color:#fff8ea;border-left:0}
#bubble .who{font:16px 'Lilita One',sans-serif;color:#8a4b12}
#bubble p{margin:4px 0 8px;font-weight:800}
#bubble .opts{display:flex;flex-direction:column;gap:6px}
#bubble .btn{background:#2a1f18;color:#fff;font-size:14px;min-height:40px;text-align:left}
#bubble small{display:block;color:#a0521a;font-weight:800;margin-top:4px}
#card{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(88%,420px);z-index:7;background:var(--pan);border:2px solid var(--amb);border-radius:16px;padding:14px;display:none;box-shadow:0 10px 30px #000a}
#card h3{margin:0 0 6px;font:22px/1.1 'Lilita One',sans-serif;color:var(--amb)}
#card p{margin:0 0 10px;font-size:15px}
#card .opts{display:flex;flex-direction:column;gap:6px}
#card small{display:block;color:var(--amb);margin-top:6px;font-weight:800}
#modal{position:absolute;inset:0;z-index:20;background:#0d0907f2;display:none;flex-direction:column;padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom));overflow:auto;touch-action:pan-y}
#modal h2{margin:4px 0 10px;font:30px/1.05 'Lilita One',sans-serif;color:var(--amb)}
#modal h4{margin:12px 0 6px;font:18px 'Lilita One',sans-serif;color:var(--amb)}
#modal .list{display:flex;flex-direction:column;gap:8px}
#modal .row{display:flex;gap:10px;align-items:center;background:var(--pan);border-radius:12px;padding:8px 10px}
#modal .row .t{flex:1}
#modal .row .t b{display:block;font-size:15px}
#modal .row .t span{font-size:12.5px;color:var(--dim)}
#modal .row.off{opacity:.5}
#modal .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#modal p{font-size:15px;margin:6px 0}
#modal .close{margin-top:14px}
.menuT{font:52px/0.95 'Lilita One',sans-serif;color:var(--amb);text-shadow:0 4px 0 #6b3c0c;margin:24px 0 4px;text-align:center}
.menuS{text-align:center;color:var(--dim);margin-bottom:18px}
#mini{position:absolute;inset:0;z-index:15;display:none;background:#000c}
#minicv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#miniui{position:absolute;left:0;right:0;top:8px;text-align:center;font:20px 'Lilita One',sans-serif;color:#fff;pointer-events:none;text-shadow:0 2px 0 #000}
#minibtns{position:absolute;left:10px;right:10px;bottom:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ach{display:flex;gap:10px;align-items:center;background:var(--pan);border-radius:12px;padding:8px}
.ach .ic{width:34px;height:34px;border-radius:50%;background:#0005;display:grid;place-items:center;font:18px 'Lilita One';color:var(--dim)}
.ach.got .ic{background:var(--amb);color:#2a1a08}
.ach.got b{color:var(--amb)}
input[type=number]{font:16px Nunito;width:90px;border-radius:8px;border:0;padding:8px;background:#0006;color:var(--ink)}
.sheet{display:flex;gap:8px;align-items:center;background:var(--pan);border-radius:12px;padding:8px 10px}
.sheet .t{flex:1}
.sheet .t span{font-size:12px;color:var(--dim)}
.ok{color:var(--grn)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div class="hud" id="hud1">
    <div class="lvl" id="lvl">Lv 1</div>
    <div style="flex:1;display:flex;flex-direction:column;gap:3px">
      <div class="bar"><i id="xpbar" style="width:0"></i></div>
      <div class="lab" id="xplab">0 / 40 XP</div>
    </div>
    <div class="lab" style="text-align:center">Leergut<br><b id="empt" style="color:var(--ink);font-size:15px">0</b></div>
    <div style="width:70px;display:flex;flex-direction:column;gap:3px">
      <div class="bar chaos"><i id="chaosbar" style="width:0"></i></div>
      <div class="lab">Chaos</div>
    </div>
    <button class="btn" id="bMenu" aria-label="Pause">☰</button>
  </div>
  <div class="hud" id="hud2">
    <div class="needs">
      <div class="need" id="nTh"><div class="lab"><span>Durst</span><span></span></div><div class="bar"><i></i></div></div>
      <div class="need" id="nHu"><div class="lab"><span>Hunger</span><span></span></div><div class="bar"><i></i></div></div>
      <div class="need" id="nBo"><div class="lab"><span>Langeweile</span><span></span></div><div class="bar"><i></i></div></div>
      <div class="need beer" id="nBe"><div class="lab"><span>Flasche</span><span></span></div><div class="bar"><i></i></div></div>
    </div>
    <div class="info" id="info"></div>
    <div class="acts">
      <button class="btn" id="bSnack" aria-label="Snack essen">🥨</button>
      <button class="btn" id="bShop" aria-label="Shop">🛒</button>
      <button class="btn" id="bDiary" aria-label="Tagebuch">📖</button>
      <button class="btn" id="bSleep" aria-label="Schlafen">🛏</button>
    </div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="toast"></div>
    <div id="hint"></div>
    <div id="bubble"></div>
    <div id="card"></div>
    <div id="mini"><canvas id="minicv"></canvas><div id="miniui"></div><div id="minibtns"></div></div>
    <div id="modal"></div>
  </div>
</div>

let AC=null,soundOn=true;

function initAudio(){if(AC)return;try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();const b=AC.createBuffer(1,1,22050);const s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0)}catch(e){AC=null}}
function env(g,t,a,d,v){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function tone(f,d,type='sine',v=.2,f2){if(!AC||!soundOn)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);env(g,t,.01,d,v);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.2,fl=800,q=1,type='lowpass',sweep){if(!AC||!soundOn)return;const t=AC.currentTime,n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(fl,t);if(sweep)f.frequency.exponentialRampToValueAtTime(sweep,t+d);f.Q.value=q;const g=AC.createGain();env(g,t,.01,d,v);s.connect(f).connect(g).connect(AC.destination);s.start(t)}
function wob(f,d,v,rate){if(!AC||!soundOn)return;const t=AC.currentTime,o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;l.frequency.value=rate;lg.gain.value=f*.35;l.connect(lg).connect(o.frequency);fl.type='lowpass';fl.frequency.value=400;env(g,t,.03,d,v);o.connect(fl).connect(g).connect(AC.destination);o.start(t);l.start(t);o.stop(t+d+.1);l.stop(t+d+.1)}

let toastT=0,toastQ=[],toastBusy=false,toastPrio=false;
function toast(msg,sub,long){const item={msg:slur(msg),sub,dur:long||(msg.length>70?4200:2200),prio:!!long||msg.length>70};

function showToast(it){const el=$('toast');el.innerHTML=it.msg+(it.sub?'<small>'+it.sub+'</small>':'');el.classList.add('on');toastBusy=true;toastPrio=it.prio;clearTimeout(toastT);

const bub=$('bubble'),card=$('card');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function visit(who,text,opts,pose=0){VISIT={who,pose,x:-220,target:0};snd(Math.random()<.5?'knock':'bell');vib(60);setTimeout(()=>showBubble(who,text,opts),650)}
function placeBubble(){const r=cv.getBoundingClientRect(),sc=r.width/W;bub.style.left=((L.visitor.x+L.visitor.w*.9)*sc)+'px';bub.style.top=((L.visitor.y-10)*sc)+'px'}
function showBubble(who,text,opts){if(!VISIT)return;placeBubble();bub.innerHTML='<div class="who">'+esc(VIS[who].n)+'</div><p>'+esc(slur(text))+'</p><div class="opts">'+opts.map((o,i)=>'<button class="btn" data-i="'+i+'">'+esc(o.t)+'</button>').join('')+'</div>';bub.style.display='block';
  bub.querySelectorAll('button').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];const r=o.f()||{};if(r.pose!==undefined)VISIT.pose=r.pose;
    bub.innerHTML='<div class="who">'+esc(VIS[who].n)+'</div><p>'+esc(slur(r.say||'…'))+'</p>'+(r.fx?'<small>'+esc(r.fx)+'</small>':'');snd('pop');
    if(r.after){setTimeout(()=>{if(VISIT)showBubble(who,r.after.text,r.after.opts)},2200);return}
    setTimeout(leave,2800);checkAch()})}
function leave(){bub.style.display='none';if(VISIT){VISIT.target=-260;setTimeout(()=>{VISIT=null},900)}evTimer=R(25,45)}
function showCard(title,text,opts){CARD=1;card.innerHTML='<h3>'+esc(title)+'</h3><p>'+esc(slur(text))+'</p><div class="opts">'+opts.map((o,i)=>'<button class="btn'+(i===0?' pri':'')+'" data-i="'+i+'">'+esc(o.t)+'</button>').join('')+'</div>';card.style.display='block';
  card.querySelectorAll('button').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];const r=(o.f&&o.f())||{};snd('pop');
    if(r.say){card.innerHTML='<h3>'+esc(title)+'</h3><p>'+esc(slur(r.say))+'</p>'+(r.fx?'<small>'+esc(r.fx)+'</small>':'')+'<div class="opts" style="margin-top:10px"><button class="btn pri">Weiter</button></div>';card.querySelector('button').onclick=closeCard}
    else closeCard();checkAch()})}
function closeCard(){card.style.display='none';CARD=null;evTimer=R(25,45)}

let callTimer=0;
function ringPhone(){CALL={c:pick(CALLS),until:S.tot+12};snd('ring');vib([200,100,200]);toast('Das Handy klingelt! Antippen zum Rangehen.');callTimer=setInterval(()=>{if(!CALL){clearInterval(callTimer);return}snd('ring');vib(150);if(S.tot>CALL.until)missCall()},1500)}
function missCall(){if(!CALL)return;const c=CALL.c;CALL=null;clearInterval(callTimer);S.h.ignored++;const r=c.miss();toast('Verpasster Anruf: '+c.n,typeof r==='string'?r:'');evTimer=R(25,45);checkAch()}
function answerCall(){const c=CALL.c;CALL=null;clearInterval(callTimer);S.h.calls++;
  showCard(c.n,c.t,c.o.map(([t,f])=>({t,f})));checkAch()}
// ---------- Scheduler ----------
function eventTick(dt){if(VISIT||CARD||CALL||busyUI)return;evTimer-=dt;if(evTimer>0)return;
  const ok=EVENTS.filter(e=>e.id!==lastEv&&e.c());const pr=ok.filter(e=>e.prio);const e=pr.length?pr[0]:pick(ok.filter(e=>!e.prio));if(!e){evTimer=10;return}
  lastEv=e.id;evTimer=R(25,45);e.run()}

  ${JOBS.map((j,i)=>{const cd=(S.jobCd[j.k]||0)>S.tot,bad=j.c&&!j.c();const rk=jobRisk(j);return`<div class="row${cd||bad?' off':''}"><div class="t"><b>${j.n}</b><span>${j.d} Std. · ${j.k==='klau'?'Sixpack + 2 Snacks':j.k==='plasma'?'6,00 €':eur(j.k==='pfand'?2:j.k==='zeitung'?4.5:j.k==='floh'?3.2:j.k==='schwarz'?16:j.k==='rad'?30:80)+' +'}${rk?' · Risiko '+Math.round(rk*100)+' % / '+eur(j.fine):''}${bad?' · '+j.cl:''}${cd?' · Abkühlzeit':''}</span></div><button class="btn pri" data-j="${i}" ${cd||bad?'disabled':''}>Los</button></div>`}).join('')}</div>${closeBtn}`,()=>bindAll({'[data-j]':el=>doJob(JOBS[+el.dataset.j]),'[data-x]':()=>{closeModal()}}))}
function doJob(j){closeModal();S.right='empty';stopFilm(true);for(let i=0;i<j.d*10;i++)advance(1);S.jobCd[j.k]=S.tot+j.d*20+40;
  const rk=jobRisk(j);if(j.risk)S.h.crimes++;
  if(j.risk&&Math.random()<rk){S.h.caught++;const f=Math.min(S.money,j.fine);S.money-=f;S.h.police+=2;if(j.k==='klau')S.h.banUntil=S.tot+480;snd('bad');toast('ERWISCHT bei: '+j.n+'. Du Amateur.','Strafe −'+eur(f)+' · Polizei +2',4000);checkAch();showDay();return}
  const m=Math.round(j.r()*100)/100;let extra=j.ex?j.ex():'';if(j.legal)S.h.legal++;else S.h.crimesOk++;if(j.risk)S.h.police+=1;

function gCatch(){miniOpen();const Wm=mcv.width,Hm=mcv.height;let px=Wm/2,items=[],t=0,score=0,lives=5,next=0;mui.textContent='Bierfänger';mbtn('Aufhören',miniClose,'btn');
  MG={move:p=>px=p.x,down:p=>px=p.x,step:dt=>{t+=dt;mc.fillStyle='#3a2b20';mc.fillRect(0,0,Wm,Hm);if(t>next){items.push({x:R(20,Wm-20),y:-20,b:Math.random()<.25,v:R(160,260)+t*4});next=t+R(.4,.9)}
   for(const it of items){it.y+=it.v*dt;if(it.b){mc.fillStyle='#3a8a2a';mc.beginPath();mc.arc(it.x,it.y,14,0,7);mc.fill();mc.fillStyle='#6b4';mc.fillRect(it.x-3,it.y+8,6,14)}else if(!mspr('bottle_1',it.x-10,it.y-26,20,52)){mc.fillStyle='#5a2f0e';mc.fillRect(it.x-7,it.y-20,14,40)}
    if(it.y>Hm-60&&it.y<Hm-20&&Math.abs(it.x-px)<55){it.gone=1;if(it.b){lives--;snd('bad')}else{score++;snd('clink')}}else if(it.y>Hm+20){it.gone=1;if(!it.b)lives--}}
   items=items.filter(i=>!i.gone);if(!mspr('crate',px-55,Hm-70,110,60)){mc.fillStyle='#e7b52a';mc.fillRect(px-55,Hm-50,110,40)}
   mui.textContent='Bierfänger · '+score+' · '+'♥'.repeat(Math.max(0,lives));if(lives<=0){MG.step=()=>{};setTimeout(()=>gameOver('catch',score,'Bierfänger'),400)}}}}
// ================= HUD =================
function setNeed(id,v,label){const el=$(id);el.classList.toggle('hot',v>=80);el.querySelector('i').style.width=v+'%';el.querySelector('.lab span:last-child').textContent=label!==undefined?label:Math.round(v)}
var warnT={th:0,hu:0,bo:0};
function hud(){$('lvl').textContent='Lv '+S.lvl;$('xpbar').style.width=(S.xp/(S.lvl*40)*100)+'%';$('xplab').textContent=Math.floor(S.xp)+' / '+S.lvl*40+' XP · ×'+xpFactor().toFixed(2);
  $('empt').textContent=S.empties;$('chaosbar').style.width=S.chaos+'%';
  setNeed('nTh',S.th);setNeed('nHu',S.hu);setNeed('nBo',S.bo);const b=S.bottle;setNeed('nBe',b?b.sips/3*100:0,b?(b.sips?Math.round(b.sips/3*100)+'%':'leer'):'–');
  const bits=['<b>'+eur(S.money)+'</b>','🍺 <b>'+S.beer+'</b>','🥨 <b>'+S.snacks+'</b>','🚬 <b>'+S.cigs+'</b>','Tag <b>'+S.day+'</b> <b>'+hourStr()+'</b>','<b>'+S.prom.toFixed(2).replace('.',',')+' ‰</b>'];
  if(S.hang>0)bits.push('Kater <b>'+'●'.repeat(S.hang)+'</b>');if(S.mold>0)bits.push('Schimmel <b>'+S.mold+'</b>');if(S.h.police>=3)bits.push('<b style="color:var(--red)">Polizei '+S.h.police+'</b>');if(S.h.cutDays>0)bits.push('Kürzung');
  $('info').innerHTML=bits.join(' · ');$('bSleep').disabled=!canSleep();$('bDiary').textContent=S.diaryNew?'📖•':'📖';
  $('hint').textContent=busyUI?'':hintText()}
// ================= LOOP =================
let lastT=performance.now(),acc=0,idleFart=R(50,150),saveT=0;
function frame(now){const dtr=Math.min(.1,(now-lastT)/1000);lastT=now;const t=now/1000;
  try{
  if(MG&&MG.step){mc.clearRect(0,0,mcv.width,mcv.height);MG.step(dtr)}
  if(!busyUI&&S.started){advance(dtr);
    holdTick();eventTick(dtr);
    // TV ads / night / film
    if(tvState.film!==null){S.bo-=1.6*dtr;if(S.tot-tvState.filmStart>=56){S.st.films++;addXP(12);toast('Abspann. Großes Kino.','XP +12');tvState.film=null;checkAch()}
      if(!tvState.brandtDone&&S.tot-tvState.filmStart>20){tvState.brandtDone=true;if(Math.random()<.25){snd('knock');S.h.neighbor++;toast('Herr Brandt hämmert an die Wand: „DAS HÖRT MAN BIS HIER!“','Nachbar +1')}}}
    else{tvState.brandtDone=false;if(S.tot-tvState.lastAd>=60&&S.tvOn){tvState.lastAd=S.tot;tvState.adUntil=S.tot+8;tvState.flies=0}
      if(tvState.adUntil>S.tot&&Math.random()<dtr*1.5)tvState.flies++;
      if(!isNight())tvState.night=false;
      if(S.ch===3&&tvState.adUntil<S.tot){schnitzelT+=dtr;if(schnitzelT>40&&!S.st.schnitzel){S.st.schnitzel=1;checkAch()}}}
    if(S.tvOn&&!powerOut())addXP(.12*dtr);
    // idle body stuff
    idleFart-=dtr;if(idleFart<=0){idleFart=R(50,150);if(!VISIT&&!CARD){snd('fart');vib(80);toast(T('fart'))}}
    // need warnings
    for(const k of['th','hu','bo']){if(S[k]>=80&&S.tot-warnT[k]>30){warnT[k]=S.tot;toast(TX[k]);snd('bad')}}
    smokeLevel=Math.max(0,smokeLevel-dtr*.03);
    if(handAnim.drink>0)handAnim.drink-=dtr*1.5;if(handAnim.throwT>0)handAnim.throwT-=dtr*2.2;if(handAnim.puff>0)handAnim.puff-=dtr;
    if(S.prom>=S.pukeAt)puke();if(S.prom<.5){S.taskDone=false}
    if(S.prom>=1.1&&!S.taskDone&&!VISIT&&!CARD){S.taskDone=true;setTimeout(offerDrunkTask,1500)}
    if(S.prom>=1.9&&!S.sickSaid){S.sickSaid=true;toast(T('sick'))}
    if(S.pendingDay)showDay();
    saveT+=dtr;if(saveT>10){saveT=0;save()}}
  // draw
  HITS=[];cx.save();
  if(S.prom>=1.1){const k=Math.min(1,(S.prom-1)/1.5);cx.translate(W/2,H/2);cx.rotate(Math.sin(t*.9)*.015*k);cx.translate(-W/2+Math.sin(t*.7)*6*k,-H/2)}
  drawRoom(t);drawVisitor(t);drawTable(t);drawHands(t);drawOverlay(t);cx.restore();
  hud()}catch(err){console.error(err)}
  requestAnimationFrame(frame)}

// ================= BINDINGS =================
$('bMenu').onclick=()=>{initAudio();snd('pop');pauseMenu()};
$('bSnack').onclick=()=>{initAudio();if(!busyUI)eatSnack()};
$('bShop').onclick=()=>{initAudio();snd('pop');shopMenu()};
$('bDiary').onclick=()=>{initAudio();snd('pop');diaryMenu()};
$('bSleep').onclick=()=>{initAudio();if(!busyUI)sleep()};
$('lvl').onclick=()=>{const n=performance.now();if(n-adminT>1500)adminTaps=0;adminT=n;if(++adminTaps>=5){adminTaps=0;adminMenu()}};
window.addEventListener('resize',()=>{layout();if(VISIT)placeBubble()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(!busyUI&&S.started)pauseMenu()}});
window.addEventListener('pagehide',save);
layout();
loadSprites().then(()=>{});
mainMenu();
requestAnimationFrame(frame);
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
}
</script>
