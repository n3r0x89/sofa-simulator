<style>#bPrank{position:relative}#bPrank.new::after{content:'';position:absolute;top:5px;right:5px;width:10px;height:10px;border-radius:50%;background:#e33;box-shadow:0 0 0 2px #2a1d16}#guestB{position:absolute;left:8px;top:34%;z-index:7;display:none;cursor:pointer;animation:gbob 2.6s ease-in-out infinite}
#guestB .gh{width:66px;height:66px;border-radius:50%;background-color:#fff3dc;background-size:240%;background-position:50% 4%;background-repeat:no-repeat;border:3px solid #f2c14e;box-shadow:0 3px 10px rgba(0,0,0,.45)}

.sideBtns .btn.sm:active{opacity:1;transform:scale(.94)}

.btn.sup{background:linear-gradient(#f2c14e,#d99a1e)!important;color:#2a1a00!important;font-weight:900}

/*
VOICE: frech, verraucht, Vorabendfernsehen
IDEA: ein vergilbtes Wohnzimmer aus Sofasicht, HUD wie ein billiger Videotext
PICTURE: der Raum selbst, mit Glotze als Lichtquelle
COLOUR and TYPE: Nikotinbraun, Bier-Bernstein, Warnrot; Lilita One + Nunito
LAYOUT: zwei Leisten oben, darunter der Raum randlos, Dialoge als Karten

:root{color-scheme:dark;--bg:#1c1410;--pan:#2a1f18;--pan2:#3a2b20;--ink:#f6e8cf;--dim:#bfa98a;--amb:#f2a93b;--red:#e2492f;--grn:#7fbf4d;--blu:#58a6d6}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 14px/1.35 Nunito,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.hud{background:var(--pan);padding:4px 8px;display:flex;gap:6px;align-items:center;border-bottom:1px solid #00000066}
.lvl{font:19px/1 'Lilita One',sans-serif;cursor:pointer;color:var(--amb);white-space:nowrap}
.bar{position:relative;height:7px;background:#0006;border-radius:6px;overflow:hidden;flex:1}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--amb);border-radius:6px;transition:width .3s}
.bar.chaos i{background:linear-gradient(90deg,#c9a24a,#8a5a2b,#5b3a1a)}
.lab{font-size:10.5px;line-height:1.2;color:var(--dim);white-space:nowrap}
.btn.sm{min-height:36px;min-width:36px;padding:0 6px;font-size:17px;border-radius:9px}
.btn{appearance:none;border:0;background:var(--pan2);color:var(--ink);font:800 15px Nunito,sans-serif;border-radius:10px;min-height:40px;min-width:44px;padding:6px 10px;cursor:pointer}
.btn:active{transform:translateY(1px);filter:brightness(1.2)}
.btn:focus-visible{outline:2px solid var(--amb)}
.btn.pri{background:var(--amb);color:#2a1a08}
.btn.red{background:var(--red)}
.btn[disabled]{opacity:.4}
#hud2{flex-direction:column;align-items:stretch;gap:3px;padding-top:2px;padding-bottom:5px}
.needs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.need .lab{display:flex;justify-content:space-between}
.need.hot i{background:var(--red)}
.need.beer i{background:linear-gradient(0deg,#d98a1d,#ffd36b)}
.info{display:flex;flex-wrap:wrap;gap:1px 9px;font-size:11.5px;line-height:1.3;color:var(--dim)}

#stage{position:relative;flex:1;overflow:hidden;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:50%;top:19%;transform:translate(-50%,-50%) scale(.9);max-width:86%;background:#120c09e8;border:2px solid var(--amb);border-radius:14px;padding:10px 14px;text-align:center;font:800 17px/1.25 Nunito,sans-serif;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:5}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#toast small{display:block;margin-top:4px;font-size:13px;color:var(--amb)}

#bubble .btn{background:#2a1f18;color:#fff;font-size:14px;min-height:40px;text-align:left}
#bubble small{display:block;color:#a0521a;font-weight:800;margin-top:4px}
#card{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(88%,420px);z-index:7;background:var(--pan);border:2px solid var(--amb);border-radius:16px;padding:14px;display:none;box-shadow:0 10px 30px #000a}

#card p{margin:0 0 10px;font-size:15px}

#card small{display:block;color:var(--amb);margin-top:6px;font-weight:800}
#modal{position:absolute;inset:0;z-index:20;background:#0d0907f2;display:none;flex-direction:column;padding:14px;padding-bottom:max(14px,env(safe-area-inset-bottom));overflow:auto;touch-action:pan-y}
#modal h2{margin:4px 0 10px;font:30px/1.05 'Lilita One',sans-serif;color:var(--amb)}

#modal .row{display:flex;gap:10px;align-items:center;background:var(--pan);border-radius:12px;padding:8px 10px}
#modal .row .t{flex:1}
#modal .row .t b{display:block;font-size:15px}

#modal .row.off{opacity:.5}
#modal .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#modal p{font-size:15px;margin:6px 0}
#modal .close{margin-top:14px}
.menuT{font:52px/0.95 'Lilita One',sans-serif;color:var(--amb);text-shadow:0 4px 0 #6b3c0c;margin:24px 0 4px;text-align:center}
.menuS{text-align:center;color:var(--dim);margin-bottom:18px}
#mini{position:absolute;inset:0;z-index:15;display:none;background:#000c}
#minicv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#miniui{position:absolute;left:0;right:0;top:8px;text-align:center;font:20px 'Lilita One',sans-serif;color:#fff;pointer-events:none;text-shadow:0 2px 0 #000}
#minibtns{position:absolute;left:10px;right:10px;bottom:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ach{display:flex;gap:10px;align-items:center;background:var(--pan);border-radius:12px;padding:8px}
.ach .ic{width:34px;height:34px;border-radius:50%;background:#0005;display:grid;place-items:center;font:18px 'Lilita One';color:var(--dim)}
.ach.got .ic{background:var(--amb);color:#2a1a08}
.ach.got b{color:var(--amb)}
input[type=number]{font:16px Nunito;width:90px;border-radius:8px;border:0;padding:8px;background:#0006;color:var(--ink)}
.sheet{display:flex;gap:8px;align-items:center;background:var(--pan);border-radius:12px;padding:8px 10px}
.sheet .t{flex:1}
.sheet .t span{font-size:12px;color:var(--dim)}
.ok{color:var(--grn)}
#self{position:absolute;left:10px;right:10px;bottom:10px;z-index:30;background:#fff8eaee;color:#2a1a08;border-radius:14px;padding:8px 12px;font:800 15px/1.3 Nunito,sans-serif;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none}
#self.on{opacity:1;transform:none}
#self b{color:#a0521a}
.fade{position:absolute;inset:0;z-index:18;background:#000;opacity:0;transition:opacity .5s;display:grid;place-items:center;color:#f6e8cf;font:28px 'Lilita One',sans-serif;pointer-events:all}
.fade.on{opacity:1}
#cv.jig2{animation:jig .06s infinite alternate}.flash{position:absolute;inset:0;z-index:17;background:#fff3b0;pointer-events:none;animation:fl .7s forwards}@keyframes fl{from{opacity:.85}to{opacity:0}}
#cv.jig{animation:jig .12s infinite alternate}@keyframes jig{from{transform:translateY(0)}to{transform:translateY(5px)}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div class="hud" id="hud1">
    <div class="lvl" id="lvl">Lv 1</div>
    <div style="flex:0 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px">
      <div class="bar"><i id="xpbar" style="width:0"></i></div>
      <div class="lab" id="xplab">0 / 40 XP</div>
    </div>
    <div id="pname"></div>
    <button class="btn sm" id="bSnack" aria-label="Snack essen">🥨</button>
    <button class="btn sm" id="bShop" aria-label="Shop">🛒</button>
    <button class="btn sm" id="bQuest" aria-label="Aufgaben">🎯</button><button class="btn sm" id="bPrank" aria-label="Streiche gegen andere Spieler">😈</button><button class="btn sm" id="bDiary" aria-label="Tagebuch" style="display:none">📖</button>
    <button class="btn sm" id="bWash" aria-label="Körperpflege">🚿</button>

  </div>
  <div class="hud" id="hud2">
    <div class="needs">
      <div class="need" id="nTh"><div class="lab"><span>Durst</span><span></span></div><div class="bar"><i></i></div></div>
      <div class="need" id="nHu"><div class="lab"><span>Hunger</span><span></span></div><div class="bar"><i></i></div></div>
      <div class="need" id="nBo"><div class="lab"><span>Langeweile</span><span></span></div><div class="bar"><i></i></div></div>
      <div class="need beer" id="nBe"><div class="lab"><span>Flasche</span><span></span></div><div class="bar"><i></i></div></div>

    <div id="mini"><canvas id="minicv"></canvas><div id="miniui"></div><div id="minibtns"></div></div>
    <div id="modal"></div>
  </div>
</div>
<script>
{
const APPVER=152;
const IDEA_MAIL='wtgames89@outlook.de';
const PAYPAL='https://www.paypal.me/wtgames89';
const TIME_SCALE=.75; // 1 Spielstunde = gut 13 Sekunden
// ================= CORE =================
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.random()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const eur=v=>(Math.round(v*100)/100).toFixed(2).replace('.',',')+' €';
const SAVE='sofasim_v2';

function fresh(){return{
  day:1,hour:8,tot:0,lvl:1,xp:0,money:5,beer:6,snacks:2,cigs:10,
  th:20,hu:20,bo:20,chaos:0,prom:0,hang:0,mold:0,
  empties:0,basket:0,pfandStock:0,bottle:null,right:'empty',cigPuffs:0,butts:0,ash:0,stash:0,stashIn:0,stashDay:0,dirt:25,lastBeer:0,lastCig:0,mag:false,magCd:0,tissues:0,punches:0,stereo:0,loud:0,packClosed:false,smolderUntil:0,
  ch:0,tvOn:true,powerOutUntil:0,remoteGone:0,
  furn:{},lampOn:false,fridge:0,fridgeColdAt:0,massageAt:0,
  puddles:[],stains:[],splats:[],
  h:{neighbor:0,nice:0,niceDeeds:0,jc:0,inkasso:0,cutDays:0,police:0,lf:0,kowNo:0,kowYes:0,crimes:0,crimesOk:0,legal:0,caught:0,ignored:0,insults:0,calls:0,pizza:0,kowLast:-9,cake:false,banUntil:0,giftDone:false,uweTrades:0,lfVisit:0,jessLast:-9,jessTv:false},
  pukeAt:R(2.1,2.5),lastPuke:-999,sickSaid:false,taskDone:false,taskIdx:0,
  diary:0,diaryNew:false,
  jobCd:{},plasmaUntil:0,
  vhs:[],vhsV2:1,
  ach:{},st:{beers:0,throws:0,puke:0,filmriss:0,clean:0,pfandBottles:0,pfandMoney:0,tvH:0,films:0,tasks:0,games:0,zaps:[],schnitzel:0},
  best:{flight:0,pong:0,catch:0},
  sound:true,hintsDone:{},started:false
}}
let S=null;
function load(){try{const t=localStorage.getItem(SAVE);if(t){const o=JSON.parse(t);if(!o.vhsV2){o.vhs=[];o.vhsV2=1}const f=fresh();for(const k in f)if(o[k]===undefined)o[k]=f[k];for(const k in f.h)if(o.h[k]===undefined)o.h[k]=f.h[k];for(const k in f.st)if(o.st[k]===undefined)o.st[k]=f.st[k];if(o.ash===undefined||o.ash===0&&o.butts)o.ash=Math.min(o.butts||0,20);return o}}catch(e){}return null}
let NOSAVE=false;
function save(){if(NOSAVE)return;try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function hasSave(){try{return !!localStorage.getItem(SAVE)}catch(e){return false}}
// Umzug auf eigene Domain: Spielstand mitnehmen
const NEWHOST='assi-simulator.de';
function dumpLS(){const o={};try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('sofasim'))o[k]=localStorage.getItem(k)}}catch(e){}return o}
function encSave(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function decSave(t){return JSON.parse(decodeURIComponent(escape(atob(t.trim()))))}
function saveScore(t){try{const o=JSON.parse(t);return o&&o.started?(o.lvl||1)*1e7+(o.day||1)*1e4+(o.xp||0):-1}catch(e){return -1}}
function applySave(o,force){if(!o||typeof o!=='object'||!o[SAVE])return false;let cur=null;try{cur=localStorage.getItem(SAVE)}catch(e){}
  if(!force&&saveScore(cur)>=saveScore(o[SAVE]))return false;try{for(const k in o)if(k.startsWith('sofasim'))localStorage.setItem(k,o[k]);return true}catch(e){return false}}
let IMPORTED=false;
(function(){const m=location.hash.match(/#import=([^&]+)/);if(!m)return;try{IMPORTED=applySave(decSave(decodeURIComponent(m[1])),false)}catch(e){}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}})();
(async function(){if(!/github\.io$/.test(location.hostname))return;try{const r=await fetch(location.pathname+'?probe='+Date.now(),{redirect:'manual',cache:'no-store'});
  if(r.type==='opaqueredirect'||r.redirected){const d=encSave(dumpLS());try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(x=>x.unregister()))}catch(e){}
    location.replace('https://'+NEWHOST+'/v2/#import='+encodeURIComponent(d))}}catch(e){}})();
S=load()||fresh();

// ---------- Audio (synth) ----------
let AC=null,soundOn=true;
try{soundOn=localStorage.getItem('sofasim_snd')!=='0'}catch(e){}
function initAudio(){if(AC)return;try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();const b=AC.createBuffer(1,1,22050);const s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0)}catch(e){AC=null}loadBanks();setTimeout(()=>{try{musicSet()}catch(e){}},0)}
function env(g,t,a,d,v){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function tone(f,d,type='sine',v=.2,f2){if(!AC||!soundOn)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);env(g,t,.01,d,v);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.05)}
function noise(d,v=.2,fl=800,q=1,type='lowpass',sweep){if(!AC||!soundOn)return;const t=AC.currentTime,n=AC.sampleRate*d,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type=type;f.frequency.setValueAtTime(fl,t);if(sweep)f.frequency.exponentialRampToValueAtTime(sweep,t+d);f.Q.value=q;const g=AC.createGain();env(g,t,.01,d,v);s.connect(f).connect(g).connect(AC.destination);s.start(t)}
function wob(f,d,v,rate){if(!AC||!soundOn)return;const t=AC.currentTime,o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),g=AC.createGain(),fl=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;l.frequency.value=rate;lg.gain.value=f*.35;l.connect(lg).connect(o.frequency);fl.type='lowpass';fl.frequency.value=400;env(g,t,.03,d,v);o.connect(fl).connect(g).connect(AC.destination);o.start(t);l.start(t);o.stop(t+d+.1);l.stop(t+d+.1)}
const SND={
  plop:()=>{tone(500,.08,'sine',.3,180);noise(.05,.1,3000)},
  gulp:()=>{tone(220,.12,'sine',.25,90);setTimeout(()=>tone(200,.1,'sine',.2,80),160)},
  burp:()=>wob(85,.55,.35,22),
  fart:()=>{wob(60,.8,.4,30);noise(.6,.15,300)},
  cough:()=>{noise(.18,.35,900,2,'bandpass');setTimeout(()=>noise(.2,.3,800,2,'bandpass'),260)},
  lighter:()=>{noise(.05,.3,4000,1,'highpass');setTimeout(()=>noise(.4,.08,2500,1,'bandpass'),80)},
  puff:()=>noise(.5,.12,1200,1,'bandpass',500),
  retch:()=>{wob(110,.5,.35,12);setTimeout(()=>noise(.7,.35,600,1,'lowpass',200),400)},
  whoosh:()=>noise(.3,.25,400,1,'bandpass',3000),
  smash:()=>{tone(2400,.25,'triangle',.2);tone(3100,.3,'triangle',.15);noise(.2,.2,5000,1,'highpass')},
  clink:()=>{tone(2400,.25,'triangle',.2);tone(3100,.3,'triangle',.15);noise(.2,.2,5000,1,'highpass')},
  slap:()=>noise(.08,.5,2000,1,'lowpass'),
  buzz:()=>tone(220,.4,'sawtooth',.05,240),
  knock:()=>{for(let i=0;i<3;i++)setTimeout(()=>noise(.06,.5,300),i*180)},

function advance(dt,mult=1){ // dt real seconds of game time passing
  const prev=S.hour;S.hour+=dt/10;S.tot+=dt;

  if(S.hour>=24){S.hour-=24;if(S.hour>=6)newDay()}
  const hk=S.hang>0?1.4:1;
  S.th+=.2*dt*(S.furn.fridge?.8:1)*hk*mult;S.hu+=.14*dt*hk*mult;S.bo+=.4*dt*(S.furn.massage?.6:1)*mult;
  S.chaos+=(S.furn.plant?-.06:-.03)*dt+.05*S.puddles.length*dt;
  S.prom=Math.max(0,S.prom-.006*dt);S.dirt=Math.min(100,(S.dirt||0)+dt*.11);

function keyFlood(g,w,h,grey){const d=g.getImageData(0,0,w,h),a=d.data,bg=new Uint8Array(w*h),st=[];

  while(st.length){const p=st.pop();if(bg[p]||!isBg(p))continue;bg[p]=1;const x=p%w;if(x>0)st.push(p-1);if(x<w-1)st.push(p+1);if(p>=w)st.push(p-w);if(p<w*(h-1))st.push(p+w)}

function lp(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function hitAt(p){for(const pid of ['basket','phone']){const kb=HITS.find(h=>h.id===pid);if(kb&&p.x>=kb.x&&p.x<=kb.x+kb.w&&p.y>=kb.y&&p.y<=kb.y+kb.h)return pid}for(let i=HITS.length-1;i>=0;i--){const h=HITS[i];if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h)return h.id}return null}
cv.addEventListener('pointerdown',e=>{initAudio();if(busyUI||PUKE)return;const p=lp(e);PD={p,t:performance.now(),id:hitAt(p),last:performance.now(),acted:false};try{cv.setPointerCapture(e.pointerId)}catch(_){}});

cv.addEventListener('pointerup',e=>{if(!PD)return;const p=lp(e),dt=performance.now()-PD.t,dx=p.x-PD.p.x,dy=p.y-PD.p.y;const id=PD.id;const acted=PD.acted;PD=null;if(busyUI)return;
  if(acted&&id==='bottle'){burpCnt++;if(burpCnt>=burpNext){burpCnt=0;burpNext=RI(1,5);clearTimeout(burpT);burpT=setTimeout(()=>{snd('burp');vib(60);if(Math.random()<.5)toast(T('burp'))},600)}}

function esc(s){return String(fem(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function visit(who,text,opts,pose=0){if(GREET[CUR_EV]&&Math.random()<.8)text=pick(GREET[CUR_EV]);if(S.dirt>70&&Math.random()<.5&&who!=='kowalski')text=pick(STINK)+' '+text;try{text=tatLine(who,text)}catch(e){}VISIT={who,pose,x:-220,target:0};snd(Math.random()<.5?'knock':'bell');vib(60);setTimeout(()=>showBubble(who,text,opts),650)}
function placeBubble(){const r=cv.getBoundingClientRect(),sc=r.width/W;bub.style.left=((L.visitor.x+L.visitor.w*.9)*sc)+'px';bub.style.top=((L.visitor.y-10)*sc)+'px'}
function showBubble(who,text,opts){if(!VISIT)return;if(PUNCHABLE[who]&&!opts.some(o=>o.punch))opts=opts.concat([Object.assign(punchOpt(who),{punch:1})]);placeBubble();const bimg=BUBBLE_IMG;BUBBLE_IMG=null;bub.innerHTML='<div class="who">'+esc(VIS[who].n)+'</div><p>'+esc(text)+'</p>'+(bimg?'<img src="'+bimg+'" alt="" style="display:block;height:110px;margin:2px auto 6px">':'')+'<div class="opts">'+opts.map((o,i)=>'<button class="btn" data-i="'+i+'">'+esc(o.t)+'</button>').join('')+'</div>';bub.style.display='block';
  bub.querySelectorAll('button').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];const r=o.f()||{};if(r.pose!==undefined&&VISIT)VISIT.pose=r.pose;
    bub.innerHTML='<div class="who">'+esc(VIS[who].n)+'</div><p>'+esc(r.say||'…')+'</p>'+(r.fx?'<small>'+esc(r.fx)+'</small>':'');snd('pop');
    if(r.after){const A=r.after;setTimeout(()=>{if(!VISIT)return;if(A.pose!==undefined)VISIT.pose=A.pose;if(A.snd)snd(A.snd);if(A.run)A.run();showBubble(who,A.text,A.opts)},A.in||2200);return}
    setTimeout(leave,r.stay||2800);checkAch()})}
function leave(){bub.style.display='none';if(VISIT){VISIT.target=-260;setTimeout(()=>{VISIT=null},900)}evTimer=R(25,45)}
function showCard(title,text,opts){CARD=1;$('toast').classList.remove('on');card.innerHTML='<h3>'+esc(title)+'</h3><p>'+esc(text)+'</p><div class="opts">'+opts.map((o,i)=>'<button class="btn'+(i===0?' pri':'')+'" data-i="'+i+'">'+esc(o.t)+'</button>').join('')+'</div>';card.style.display='block';
  card.querySelectorAll('button').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i];const r=(o.f&&o.f())||{};snd('pop');
    if(r.say){card.innerHTML='<h3>'+esc(title)+'</h3><p>'+esc(r.say)+'</p>'+(r.fx?'<small>'+esc(r.fx)+'</small>':'')+'<div class="opts" style="margin-top:10px"><button class="btn pri">Weiter</button></div>';card.querySelector('button').onclick=closeCard}
    else closeCard();checkAch()})}

let UPD=null;
async function checkUpdate(){try{const r=await fetch('./index.html?u='+Date.now(),{cache:'no-store'});if(!r.ok)return;const tx=await r.text();const m=tx.match(/const APPVER=(\d+)/);
  if(m&&+m[1]>APPVER){const neu=UPD!==+m[1];UPD=+m[1];if(mainOpen&&document.getElementById('updLow'))mainMenu();
    const bm=document.getElementById('bMenu');if(bm)bm.classList.add('updDot');if(neu&&!mainOpen)toast('Neues Update da (Version '+UPD+')','Im Menü auf „Aktualisieren“ tippen',4000)}}catch(e){}}
async function doUpdate(){const b=document.querySelector('[data-a="upd"]');if(b)b.textContent='Wird aktualisiert …';
  try{if(window.caches){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('sofa-v2-')).map(k=>caches.delete(k)))}
    if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.update().catch(()=>{})))}}catch(e){}
  save();location.replace(location.pathname+'?v='+Date.now())}
setTimeout(checkUpdate,8000);setInterval(checkUpdate,5*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate()});

// ---------- Tagesaufgaben (XP verdienen) ----------
const QUESTS=[
 {k:'beer',n:'Trink {n} Bier',r:[3,6],g:()=>S.st.beers,xp:4},
 {k:'cig',n:'Rauch {n} {Kippe|Kippen}',r:[3,6],g:()=>S.butts,xp:3},
 {k:'clean',n:'Putz {n} {Sauerei|Sauereien} weg',r:[2,4],g:()=>S.st.clean||0,xp:6},
 {k:'pfand',n:'Bring {n} {Pfandflasche|Pfandflaschen} weg',r:[4,9],g:()=>S.st.pfandBottles,xp:3},
 {k:'tasks',n:'Erledige {n} {Suff-Aufgabe|Suff-Aufgaben}',r:[1,2],g:()=>S.st.tasks,xp:12},
 {k:'film',n:'Guck {n} Film zu Ende',r:[1,1],g:()=>S.st.films,xp:15,ok:()=>!!S.furn.vcr},
 {k:'job',n:'Mach {n} {ehrlichen Job|ehrliche Jobs}',r:[1,2],g:()=>S.h.legal,xp:12},
 {k:'game',n:'Spiel {n} {Konsolen-Spiel|Konsolen-Spiele}',r:[1,3],g:()=>S.st.games,xp:8,ok:()=>!!S.furn.console},
 {k:'throw',n:'Wirf {n} {Flasche|Flaschen} an die Wand',r:[2,4],g:()=>S.st.throws,xp:4},
 {k:'tv',n:'Glotz {n} {Stunde|Stunden} Fernsehen',r:[2,4],g:()=>Math.floor(S.st.tvH),xp:5}];
function qn(Q,n){return Q.n.replace('{n}',n).replace(/\{([^|}]*)\|([^}]*)\}/g,(m,s,pl)=>n===1?s:pl)}
function newQuests(){const prev=S.quests?S.quests.list.map(q=>q.k):[];const pool=QUESTS.filter(q=>!prev.includes(q.k)&&(!q.ok||q.ok())).sort(()=>Math.random()-.5).slice(0,3);S.quests={set:((S.quests&&S.quests.set)||0)+1,list:pool.map(q=>{const n=RI(q.r[0],q.r[1]);return{k:q.k,n,base:q.g(),xp:Math.round(10+n*q.xp),money:Math.round(RI(2,6)),done:false}})}}
function questTick(){if(!S.started||busyUI)return;if(!S.quests||!S.quests.list){newQuests()}
  for(let i=0;i<S.quests.list.length;i++){const q=S.quests.list[i],Q=QUESTS.find(x=>x.k===q.k);if(!q.done&&Q&&Q.ok&&!Q.ok()){const used=S.quests.list.map(x=>x.k);const alt=QUESTS.filter(x=>!used.includes(x.k)&&(!x.ok||x.ok())).sort(()=>Math.random()-.5)[0];if(alt){const n=RI(alt.r[0],alt.r[1]);S.quests.list[i]={k:alt.k,n,base:alt.g(),xp:Math.round(10+n*alt.xp),money:RI(2,6),done:false}}}}
  for(const q of S.quests.list){if(q.done)continue;const Q=QUESTS.find(x=>x.k===q.k);if(Q&&Q.g()-q.base>=q.n){q.done=true;addXP(q.xp);S.money+=q.money;snd('lvl');toast('Tagesaufgabe geschafft: '+qn(Q,q.n),'XP +'+q.xp+' · Geld +'+eur(q.money),4000)}}
  const all=S.quests.list.every(q=>q.done);if(all&&!S.quests.bonus){S.quests.bonus=true;addXP(40);S.money+=10;toast('Alle drei Aufgaben erledigt! Fast schon produktiv.','Bonus: XP +40 · Geld +10,00 € · 3 neue Aufgaben warten',4500);setTimeout(()=>{newQuests();snd('pop');toast('3 neue Aufgaben','Tippe oben auf 🎯',3500)},5000)}}
function questMenu(back){if(!S.quests||!S.quests.list)newQuests();
  openModal(`<h2>Aufgaben</h2><p>Drei Aufgaben. Jede bringt XP und ein bisschen Geld. Sind alle drei erledigt, gibt’s einen Bonus und drei neue.</p><div class="list">${S.quests.list.map(q=>{const Q=QUESTS.find(x=>x.k===q.k),pr=Math.min(q.n,Math.max(0,Q.g()-q.base));return`<div class="row${q.done?' off':''}"><div class="t"><b>${q.done?'✔ ':''}${esc(qn(Q,q.n))}</b><span>${pr} / ${q.n} · XP +${q.xp} · ${eur(q.money)}</span></div></div>`}).join('')}</div>${S.quests.bonus?'<p><b>Bonus kassiert.</b></p>':''}<div class="list"><button class="btn" data-q="back">Zurück</button></div>`,()=>bindAll({'[data-q]':()=>back?back():closeModal()}))}
setInterval(()=>{try{questTick()}catch(e){}},1500);

// ================= MINIGAMES =================
const MI=$('mini'),mcv=$('minicv'),mc=mcv.getContext('2d'),mui=$('miniui'),mbt=$('minibtns');
let MG=null;
function miniOpen(){busyUI=true;MI.style.display='block';const r=MI.getBoundingClientRect();mcv.width=r.width;mcv.height=r.height;mbt.innerHTML='';mui.textContent=''}
function miniClose(){MI.style.display='none';MG=null;busyUI=false;mbt.innerHTML=''}
function mpos(e){const r=mcv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
mcv.addEventListener('pointerdown',e=>{if(MG&&MG.down)MG.down(mpos(e))});

  mui.textContent=title;
  let tool={x:Wm*.5,y:Hm*.8,t:-9},buzzT=.3;
  MG={move:p=>{tool.x=p.x;tool.y=p.y},down:p=>{tool={x:p.x,y:p.y,t:performance.now()/1000};let hit=false;for(const b of bugs)if(!b.dead&&Math.hypot(p.x-b.x,p.y-b.y)<36){b.dead=1;hits++;hit=true;snd('slap');vib(30);{const z=L.stainZone||{x:0,y:0,w:W,h:L.wall-20};S.splats.push({x:z.x+p.x/Wm*z.w,y:z.y+p.y/Hm*z.h,k:kind,v:1+(Math.random()<.5?1:0)})};if(S.splats.length>40)S.splats.shift();setTimeout(()=>bugs.push(nb()),400)}if(!hit)snd('pop')},
   step:dt=>{const el=(performance.now()-t0)/1000;if(kind==='fly'||kind==='mosquito'){buzzT-=dt;if(buzzT<=0&&bugs.some(b=>!b.dead)){buzzT=R(.7,1.6);snd('buzz')}}const rm=SP.room;if(rm&&rm.naturalWidth){const sc=Math.max(Wm/rm.naturalWidth,Hm/(rm.naturalHeight*.55));mc.drawImage(rm,0,0,rm.naturalWidth,rm.naturalHeight*.55,(Wm-rm.naturalWidth*sc)/2,0,rm.naturalWidth*sc,rm.naturalHeight*.55*sc);mc.fillStyle='rgba(0,0,0,.25)';mc.fillRect(0,0,Wm,Hm)}else{mc.fillStyle='#d8c08a';mc.fillRect(0,0,Wm,Hm);mc.fillStyle='#0002';for(let x=0;x<Wm;x+=30)mc.fillRect(x,0,15,Hm)}
    for(const b of bugs){if(b.dead){const sk=splatKey(kind,b.v||(b.v=1+(Math.random()<.5?1:0)));if(sk&&(kind==='fly'||kind==='roach'||kind==='mosquito')){const s=kind==='roach'?52:38;mc.drawImage(SP[sk],b.x-s/2,b.y-s/2,s,s*SP[sk].naturalHeight/SP[sk].naturalWidth)}else{mc.fillStyle='#3a1a0a';mc.beginPath();mc.ellipse(b.x,b.y,10,7,0,0,7);mc.fill()}continue}b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.random()<.03){b.vx=R(-200,200);b.vy=R(-200,200)}if(b.x<20||b.x>Wm-20)b.vx*=-1;if(b.y<50||b.y>Hm-20)b.vy*=-1;
     if(!mspr(kind,b.x-20,b.y-20,40,40)){mc.fillStyle=kind==='dustbunny'?'#999':kind==='roach'?'#5a3010':'#222';mc.beginPath();mc.ellipse(b.x,b.y,kind==='roach'?14:9,kind==='roach'?8:6,0,0,7);mc.fill();if(kind!=='roach'&&kind!=='dustbunny'){mc.fillStyle='#cde8';mc.beginPath();mc.ellipse(b.x-6,b.y-7,7,4,-.5,0,7);mc.ellipse(b.x+6,b.y-7,7,4,.5,0,7);mc.fill()}}}
    drawSwatTool(kind==='roach'?'roach':'fly',tool.x,tool.y,performance.now()/1000-tool.t);
    mui.textContent=title+' · '+hits+' · '+Math.max(0,Math.ceil(dur-el))+' s';
    if(el>=dur){const b=Math.round(clamp(12+hits*.6,12,18));S.st.tasks++;miniClose();toast(hits+' erwischt. Mehr Tote als Frauen in deinem Leben.',fx({bo:-b,xp:3}));checkAch()}}};}
function countGame(kind,title){miniOpen();const Wm=mcv.width,Hm=mcv.height,n=RI(4,11);let shown=0,t0=performance.now(),items=[],next=0;mui.textContent=title+': gut aufpassen!';
  MG={step:dt=>{const el=(performance.now()-t0)/1000;mc.fillStyle=kind==='drop'?'#2a3a4a':'#9cc8ea';mc.fillRect(0,0,Wm,Hm);

  const cw=Math.min(300,Wm-40),ch=180,x0=(Wm-cw)/2,y0=(Hm-ch)/2;const cover=document.createElement('canvas');cover.width=cw;cover.height=ch;const g=cover.getContext('2d');g.fillStyle='#b0b0b8';g.fillRect(0,0,cw,ch);g.fillStyle='#888';g.font='800 18px Nunito,sans-serif';g.textAlign='center';g.fillText('RUBBELN!',cw/2,ch/2);let cleared=0,done=false;

function gFlight(){miniOpen();const Wm=mcv.width,Hm=mcv.height;let y=Hm/2,vy=0,pipes=[],t=0,score=0,alive=true;mui.textContent='Flaschen-Flug · tippen zum Flattern';mbtn('Aufhören',miniClose,'btn');

   if(!pipes.length||pipes[pipes.length-1].x<Wm-220)pipes.push({x:Wm+40,gap:R(120,Hm-180),p:0});
   for(const p of pipes){p.x-=150*dt;for(const[yy,hh]of[[0,p.gap-80],[p.gap+80,Hm]]){mc.fillStyle='#e7b52a';mc.fillRect(p.x,yy,60,hh-yy);mc.fillStyle='#b88a14';for(let k=yy;k<hh;k+=30)mc.fillRect(p.x,k,60,4)}

function gPong(){miniOpen();const Wm=mcv.width,Hm=mcv.height;let px=Wm/2,cx2=Wm/2,bx=Wm/2,by=Hm/2,vx=R(-160,160),vy=260,me=0,cpu=0;mui.textContent='Assi-Pong · ziehen zum Steuern';mbtn('Aufhören',miniClose,'btn');

  let b=list.slice(0,50).map(p=>[p.id,p.n,p.l,p.x,p.d,p.seen]);let body=JSON.stringify({type:'board',v:1,b});while(body.length>3800&&b.length>5){b=b.slice(0,b.length-5);body=JSON.stringify({type:'board',v:1,b})}
  await fetch(RANK_URL,{method:'POST',body});try{localStorage.setItem('sofasim_boardsent',String(now))}catch(e){}lastBoardSeen=now}catch(e){}}

  await rankSend(true);let list=[];let err=false;try{list=await rankLoad();rankBoardSend(list)}catch(e){err=true;list=Object.values(rankArch()).sort((a,b)=>b.l-a.l||b.x-a.x||b.d-a.d)}

async function prankPoll(){try{if(!S.started)return;const r=await fetch(RANK_URL+'/json?poll=1&since=12h',{cache:'no-store'});if(!r.ok)return;const tx=await r.text();const me=playerId();let done=[];try{done=JSON.parse(localStorage.getItem('sofasim_prankdone')||'[]')}catch(e){}
  for(const line of tx.split('\n')){if(!line.trim())continue;let mm;try{mm=JSON.parse(line)}catch(e){continue}if(mm.event!=='message')continue;let q;try{q=JSON.parse(mm.message)}catch(e){continue}
    if(!q||q.type!=='prank'||q.to!==me||done.includes(mm.id))continue;const x=PRANKS.find(y=>y.k===q.k);if(!x)continue;done.push(mm.id);
    const you=Object.assign({},x.you);if(you.beer)you.beer=-Math.min(S.beer,-you.beer);if(you.money)you.money=-Math.min(Math.max(0,S.money),-you.money);if(you.xp)you.xp=-Math.min(Math.floor(S.xp),-you.xp);

    const fn=String(q.fn||'Irgendein Assi').slice(0,20);snd(x.sndA);try{document.getElementById('bPrank').classList.add('new')}catch(e){}const sub=fx(you);toast('😈 '+x.msg(fn),sub,5000)}
  if(done.length>200)done=done.slice(-200);try{localStorage.setItem('sofasim_prankdone',JSON.stringify(done))}catch(e){}}catch(e){}}
